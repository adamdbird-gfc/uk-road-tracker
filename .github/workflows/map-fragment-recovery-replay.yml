name: Map fragment recovery regression and warm upgrade replay
on:
  push:
    branches: [validation/map-fragment-recovery-314]
    paths: [.github/workflows/map-fragment-recovery-replay.yml]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: adamdbird-gfc/uk-road-tracker
      JAVA_TOOL_OPTIONS: -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=256m
      NCN_TEST_DATABASE: ${{ github.workspace }}/.cache/ncn/catalogue.db
      BASELINE: 95cc2d28051a7eca37ab0774e693616e2b5d8874
      ENGINEERING: 54da3eec09ac5346229e7f6e00abd9ab712cb560
      CERT_SHA256: 5b7cdba0abd0cb41d570cdc348e3ca9bb8e2312cb7adf568bb536ce8577cc031
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify exact engineering source and Build 313 baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse 'roadprints-0.25.267-313^{}')" = "$BASELINE"
          git diff --exit-code "$ENGINEERING" HEAD -- android-prototype
          git diff --exit-code "$BASELINE" "$ENGINEERING" -- android-prototype/app/src/main/assets android-prototype/app/src/main/res ':(glob)**/Ncn*.java'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore immutable Build 313 assets
        run: |
          set -euo pipefail
          gh release download roadprints-0.25.267-313 --pattern Roadprints-0.25.267-313.apk --output "$RUNNER_TEMP/roadprints313.apk"
          assets=android-prototype/app/src/main/assets
          for asset in historic-counties/boundaries.bin railway/national.json railway/national.sqlite.gzip; do
            unzip -p "$RUNNER_TEMP/roadprints313.apk" "assets/$asset" > "$assets/$asset"
          done
          unzip -p "$RUNNER_TEMP/roadprints313.apk" assets/uk-road-reference-v1.bin > "$RUNNER_TEMP/uk-road-reference-v3.bin"
      - name: Extract bounded real v3 reference tiles for JVM tests
        run: |
          python - <<'PY'
          import os,pathlib,struct
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'uk-road-reference-v3.bin'
          target=pathlib.Path('android-prototype/app/src/main/assets/uk-road-reference-v1.bin')
          with source.open('rb') as r:
              header=r.read(40)
              assert header[:8]==b'RPRD0003'
              count,=struct.unpack('>i',r.read(4))
              rows=[x for x in struct.iter_unpack('>iiii',r.read(count*16)) if 17<=x[0]<=20 and 2570<=x[1]<=2573]
              assert rows
              with target.open('wb') as w:
                  w.write(header+struct.pack('>i',len(rows)))
                  offset=44+16*len(rows)
                  for x,y,_,size in rows:
                      w.write(struct.pack('>iiii',x,y,offset,size))
                      offset+=size
                  for _,_,original,size in rows:
                      r.seek(original)
                      data=r.read(size)
                      assert len(data)==size
                      w.write(data)
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/ncn/catalogue.db
          key: reference-pins-v2-${{ runner.os }}-${{ hashFiles('android-prototype/app/src/main/assets/ncn-national/manifest.json', 'android-prototype/app/src/main/assets/historic-counties/catalogue.json') }}
      - name: Restore and verify the pinned NCN test database
        run: |
          python - <<'PYTHON'
          import gzip,hashlib,json,os,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('android-prototype/app/src/main/assets/ncn-national/manifest.json').read_text())
          target=pathlib.Path(os.environ['NCN_TEST_DATABASE'])
          def valid(path, digest, size):
              if not path.is_file() or path.stat().st_size!=size:
                  return False
              with path.open('rb') as source:
                  return hashlib.file_digest(source,'sha256').hexdigest()==digest
          if not valid(target,manifest['sha256'],manifest['database_bytes']):
              target.parent.mkdir(parents=True,exist_ok=True)
              packed=pathlib.Path(os.environ['RUNNER_TEMP'])/'pinned-ncn.db.gz'
              url='https://roadprints-data-822cc.web.app/'+manifest['filename']
              with urllib.request.urlopen(url,timeout=90) as source, packed.open('wb') as out:
                  total=0
                  while chunk:=source.read(1024*1024):
                      total+=len(chunk)
                      assert total<=manifest['compressed_bytes'],'NCN response exceeds pinned size'
                      out.write(chunk)
              assert valid(packed,manifest['compressed_sha256'],manifest['compressed_bytes'])
              with gzip.open(packed,'rb') as source,target.open('wb') as out:
                  total=0
                  while chunk:=source.read(1024*1024):
                      total+=len(chunk)
                      assert total<=manifest['database_bytes'],'NCN expansion exceeds pinned size'
                      out.write(chunk)
          assert valid(target,manifest['sha256'],manifest['database_bytes'])
          print('Verified exact pinned NCN test database',manifest['sha256'])
          PYTHON
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Gate A – compile Android and run focused fragment regressions
        run: |
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:compileDebugJavaWithJavac :app:testDebugUnitTest \
            --tests '*.MapRecoveryEngineeringTest.warmBuild313TruncationIsRefreshedAndRetainedOnNextOpen' \
            --tests '*.MapRecoveryEngineeringTest.deferredOverseasEmptyProjectionIsResolvedAndIndexed' \
            --tests '*.MapRecoveryEngineeringTest.cappedWorldwideFragmentRetainsVerifiedPrefixInsteadOfDroppingIt' \
            --tests '*.MapRecoveryEngineeringTest.legacyTruncationKeepsPreviouslyDisplayedFragmentsWhenRefreshIsDeferred'
      - name: Save focused regression receipts
        run: cp -R android-prototype/app/build/test-results/testDebugUnitTest "$RUNNER_TEMP/gate-a-tests"
      - name: Gate B – Map, Android navigation and canonical coverage regression suite
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:testDebugUnitTest \
            --tests com.roadprints.capture.MapRecoveryEngineeringTest \
            --tests com.roadprints.capture.ARoadProgressCalculatorTest \
            --tests com.roadprints.capture.MapLoadingNavigationTest \
            --tests com.roadprints.capture.NavigationPerformanceTest \
            --tests com.roadprints.capture.MapWorkerQueueTest \
            --tests com.roadprints.capture.RoadCandidateCollectionTest \
            --tests com.roadprints.capture.AcceptedRoadRouteTest \
            --tests com.roadprints.capture.CompactJourneyCacheResumeTest \
            --tests com.roadprints.capture.MapActivityOverviewCoverageTest \
            --tests com.roadprints.capture.MapCoverageBatchGateTest \
            --tests com.roadprints.capture.CanonicalPreviewIndexTest \
            --tests com.roadprints.capture.MapJourneyStoreCacheMigrationTest \
            --tests com.roadprints.capture.RailwayTrialWorkerTest \
            --tests com.roadprints.capture.LocalRoadCoverageTest \
            --tests com.roadprints.capture.OverviewJourneyScopeTest \
            --tests com.roadprints.capture.OverseasMatchedGeometryTest \
            --tests com.roadprints.capture.MapRoadTapSelectionTest \
            --tests com.roadprints.capture.FootpathResidualGeometryTest \
            --tests com.roadprints.capture.MatchedCorridorAccumulatorTest \
            --tests com.roadprints.capture.NcnNationalTest \
            --tests com.roadprints.capture.NcnUiTest \
            --tests com.roadprints.capture.NcnAndroidTest \
            --tests com.roadprints.capture.NcnGeometryTest \
            --tests com.roadprints.capture.MapRenderIdentityTest \
            --tests com.roadprints.capture.MatchedCorridorIntervalUnionTest \
            > "$RUNNER_TEMP/map-worldwide-359.log" 2>&1 || {
              grep -nE -A3 -B2 '(error:|FAILED|failure|AssertionError|Caused by:)' "$RUNNER_TEMP/map-worldwide-359.log" | head -90 || true
              tail -n 70 "$RUNNER_TEMP/map-worldwide-359.log"
              exit 1
            }
          tail -n 30 "$RUNNER_TEMP/map-worldwide-359.log"
      - name: Prepare the 1,681-record fixture with a capped overseas control
        run: |
          set -euo pipefail
          python3 scripts/generate_map_recovery_fixture.py --reference "$RUNNER_TEMP/uk-road-reference-v3.bin" --output "$RUNNER_TEMP/scale-fixtures" --assets canonical-a-roads-v5
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          fixture = Path(os.environ["RUNNER_TEMP"]) / "scale-fixtures"
          assert len(list(fixture.glob("journey_*.json"))) == 1681
          file = fixture / "journey_scale-paris-0.json"
          row = json.loads(file.read_text())
          row["processing_result"]["geojson"]["features"].append({
              "type": "Feature", "properties": {}, "geometry": {"type": "LineString",
                  "coordinates": [[round(10 + i * .001, 3), 50] for i in range(351)]},
          })
          file.write_text(json.dumps(row))
          PY
      - name: Assemble and verify the in-place upgrade for emulator replay
        env:
          ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
          ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
          ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
          ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROADPRINTS_DEBUG_KEYSTORE_B64"
          test -n "$ROADPRINTS_DEBUG_STORE_PASSWORD"
          test -n "$ROADPRINTS_DEBUG_KEY_ALIAS"
          test -n "$ROADPRINTS_DEBUG_KEY_PASSWORD"
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/fragment-owner.keystore"
          trap 'rm -f "$ROADPRINTS_DEBUG_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$ROADPRINTS_DEBUG_KEYSTORE"
          unset ROADPRINTS_DEBUG_KEYSTORE_B64
          cp "$RUNNER_TEMP/uk-road-reference-v3.bin" android-prototype/app/src/main/assets/uk-road-reference-v1.bin
          python3 - <<'PY'
          from pathlib import Path
          build = Path("android-prototype/app/build.gradle.kts")
          source = build.read_text()
          assert source.count("versionCode = 310") == source.count('versionName = "0.25.264"') == 1
          build.write_text(source.replace("versionCode = 310", "versionCode = 314").replace('versionName = "0.25.264"', 'versionName = "0.25.268"'))
          PY
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:assembleDebug
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/roadprints-recovery.apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in roadprints313 roadprints-recovery; do
            "$signer" verify --print-certs "$RUNNER_TEMP/$apk.apk" | grep -F "certificate SHA-256 digest: $CERT_SHA256"
          done
          "${signer%/*}/aapt" dump badging "$RUNNER_TEMP/roadprints-recovery.apk" | grep -F "package: name='com.roadprints.capture' versionCode='314' versionName='0.25.268'"
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(temp / "roadprints313.apk") as baseline, zipfile.ZipFile(temp / "roadprints-recovery.apk") as candidate:
              for asset in ("uk-road-reference-v1.bin", "railway/national.sqlite.gzip", "railway/national.json", "historic-counties/boundaries.bin"):
                  with baseline.open("assets/" + asset) as before, candidate.open("assets/" + asset) as after:
                      assert hashlib.file_digest(before, "sha256").digest() == hashlib.file_digest(after, "sha256").digest(), asset
          PY
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gate C – replay Build 313, in-place upgrade and independent cold runs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          heap-size: 256M
          disable-animations: true
          script: bash scripts/check_map_fragment_upgrade.sh
      - name: Upload regression and replay receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-fragment-upgrade-evidence
          path: |
            ${{ runner.temp }}/map-worldwide-359.log
            ${{ runner.temp }}/scale-*.log
            ${{ runner.temp }}/scale-*.xml
            ${{ runner.temp }}/scale-*.sha256
            ${{ runner.temp }}/scale-*meminfo.txt
            ${{ runner.temp }}/scale-summary.json
            ${{ runner.temp }}/gate-a-tests/
            android-prototype/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Save the verified signed APK for the gated release
        uses: actions/upload-artifact@v4
        with:
          name: signed-map-fragment-upgrade-314
          path: ${{ runner.temp }}/roadprints-recovery.apk
          compression-level: 0
          if-no-files-found: error
