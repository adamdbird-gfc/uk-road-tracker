name: Map Laboratory junction evidence tests
on:
  pull_request:
    paths:
      - 'map-laboratory/**'
      - '.github/workflows/map-laboratory-junction-tests.yml'
  push:
    paths:
      - 'map-laboratory/**'
      - '.github/workflows/map-laboratory-junction-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm current laboratory script compiles
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const page = fs.readFileSync('map-laboratory/index.html','utf8');
          const js = page.split('<script>')[1].split('</script>')[0];
          new Function(js);
          console.log('Lab JavaScript syntax OK');
          NODE
      - name: Check junction and short-path rules
        run: node map-laboratory/tests/junction-evidence.test.cjs
      - name: Check local map-credit provenance
        run: node map-laboratory/tests/inspector-provenance.test.cjs
      - name: Check whole-way inspector first-credit provenance
        run: node map-laboratory/tests/inspector-way-evidence.test.cjs

      - name: Check competing junction credit
        run: node map-laboratory/tests/junction-singleton.test.cjs

      - name: Check road-transition boundary evidence
        run: node map-laboratory/tests/transition-boundary.test.cjs

      - name: Check road-adjacent footway equivalence
        run: node map-laboratory/tests/road-footway-equivalence.test.cjs
      - name: Check evidence-backed walking entrance links
        run: node map-laboratory/tests/entrance-link-evidence.test.cjs

      - name: Check unsupported footway endcap evidence
        run: node map-laboratory/tests/footway-endcap.test.cjs

      - name: Check walked-road centreline equivalence
        run: node map-laboratory/tests/road-centreline-promotion.test.cjs

      - name: Check continuous route choice and retained real-path gaps
        run: node map-laboratory/tests/continuity-path.test.cjs

      - name: Check physical-road candidates before continuity replay
        run: node map-laboratory/tests/equivalence-aware-continuity.test.cjs

      - name: Verify canonical physical-road coverage and historical equivalence
        run: node map-laboratory/tests/canonical-physical-coverage.test.cjs

      - name: Verify canonical pedestrian links cannot duplicate road coverage
        run: node map-laboratory/tests/canonical-walking-links.test.cjs

      - name: Check final canonical-network connectivity audit
        run: node map-laboratory/tests/postcanonical-continuity.test.cjs

      - name: Check evidence-backed short road junction gaps
        run: node map-laboratory/tests/evidence-backed-road-gaps.test.cjs

      - name: Trace selected and uncredited physical-network intervals
        run: node map-laboratory/tests/coverage-stage-trace.test.cjs
