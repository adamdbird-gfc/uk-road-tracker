name: Validate Android 0.25.220 integration candidate (no release)

on:
  push:
    branches:
      - integration/android-025220-candidate
  pull_request:
    branches:
      - main
    paths:
      - 'android-prototype/**'
      - '.github/workflows/android-candidate-validation.yml'

permissions:
  contents: read

jobs:
  compile-and-test:
    if: github.head_ref == 'integration/android-025220-candidate' || github.ref == 'refs/heads/integration/android-025220-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Android SDK available on runner
        run: test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}" && echo "Android SDK available"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Compile Android Java
        working-directory: android-prototype
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Android lint
        working-directory: android-prototype
        run: gradle --no-daemon :app:lintDebug
      - name: Explain reference-dependent test prerequisites
        run: |
          echo "Pinned historic county boundaries and NCN SQLite database are intentionally not tracked in Git."
          echo "Full 810-test parity requires verified reference pins from the existing protected offline cache."
          test ! -f android-prototype/app/src/main/assets/historic-counties/boundaries.bin
          test ! -f .cache/ncn/catalogue.db
      - name: Run reference-independent unit tests
        working-directory: android-prototype
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.roadprints.capture.*' \
            -x :app:lintDebug \
            -PncnOfflineChecks=true
      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-validation-reports
          path: |
            android-prototype/app/build/reports/
            android-prototype/app/build/test-results/
          if-no-files-found: warn
          retention-days: 3
