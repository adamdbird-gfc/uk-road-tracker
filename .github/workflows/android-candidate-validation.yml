name: Validate Android 0.25.220 integration candidate (no release)

on:
  push:
    branches:
      - integration/android-025220-candidate
  pull_request:
    branches:
      - main
    paths:
      - 'android-prototype/**'
      - '.github/workflows/android-candidate-validation.yml'

permissions:
  contents: read

jobs:
  compile-and-test:
    if: github.head_ref == 'integration/android-025220-candidate' || github.ref == 'refs/heads/integration/android-025220-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, lint and run unit tests (no APK publication)
        working-directory: android-prototype
        run: gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac :app:testDebugUnitTest :app:lintDebug
