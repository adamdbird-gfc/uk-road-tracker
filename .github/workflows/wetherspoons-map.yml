name: Reviewed Wetherspoons map
on:
  push:
    paths:
      - 'scripts/*wetherspoons_map.py'
      - 'collections/wetherspoons-map-reviews-v1.json'
      - 'android-prototype/app/src/main/assets/collections/**'
  pull_request:
    paths:
      - 'scripts/*wetherspoons_map.py'
      - 'collections/wetherspoons-map-reviews-v1.json'
      - 'android-prototype/app/src/main/assets/collections/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p test_wetherspoons_map.py -v
