name: Reviewed Wetherspoons map
on:
  push:
    paths:
      - 'scripts/*wetherspoons_map.py'
      - 'scripts/test_wetherspoons_completion.py'
      - 'scripts/venue_approval.py'
      - 'collections/wetherspoons-coverage-review-v1.json'
      - 'collections/published/wetherspoons/**'
      - 'collections/wetherspoons-map-reviews-v1.json'
      - 'collections/wetherspoons-supplemental-map-reviews-v1.json'
      - 'android-prototype/app/src/main/assets/collections/**'
  pull_request:
    paths:
      - 'scripts/*wetherspoons_map.py'
      - 'scripts/test_wetherspoons_completion.py'
      - 'scripts/venue_approval.py'
      - 'collections/wetherspoons-coverage-review-v1.json'
      - 'collections/published/wetherspoons/**'
      - 'collections/wetherspoons-map-reviews-v1.json'
      - 'collections/wetherspoons-supplemental-map-reviews-v1.json'
      - 'android-prototype/app/src/main/assets/collections/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*wetherspoons_map.py' -v

      - run: python3 -m unittest discover -s scripts -p test_wetherspoons_completion.py -v

      - run: python3 scripts/publish_wetherspoons_map.py --verify --directory collections/published/wetherspoons

