name: Roadside Pack regression

on:
  push:
    paths:
      - "app.js"
      - "index.html"
      - "collections/uk-motorway-services-v1.json"
      - "scripts/check_roadside_pack_regression.mjs"
      - ".github/workflows/roadside-pack-regression.yml"
  pull_request:
    paths:
      - "app.js"
      - "index.html"
      - "collections/uk-motorway-services-v1.json"
      - "scripts/check_roadside_pack_regression.mjs"
      - ".github/workflows/roadside-pack-regression.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check_roadside_pack_regression.mjs
