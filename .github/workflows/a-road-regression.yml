name: A-road regression checks

on:
  push:
    paths:
      - app.js
      - canonical-a-roads-v4/**
      - scripts/check_a_road_regression.mjs
      - .github/workflows/a-road-regression.yml
  pull_request:
    paths:
      - app.js
      - canonical-a-roads-v4/**
      - scripts/check_a_road_regression.mjs
      - .github/workflows/a-road-regression.yml

jobs:
  a-road-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check_a_road_regression.mjs
