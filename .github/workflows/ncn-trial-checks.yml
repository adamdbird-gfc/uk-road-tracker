name: NCN local trial checks
on:
  pull_request:
    paths:
      - 'scripts/ncn_trial/**'
      - 'tests/fixtures/ncn-*/**'
      - 'requirements-ncn-trial.txt'
      - 'matched_path_evidence.py'
      - 'cycling_path_evidence.py'
      - '.github/workflows/ncn-trial-checks.yml'
permissions:
  contents: read
concurrency:
  group: ncn-trial-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  local-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-ncn-trial.txt
      - run: python -m unittest scripts.ncn_trial.test_coverage scripts.ncn_trial.test_review scripts.ncn_trial.test_regions scripts.ncn_trial.test_matched_context scripts.ncn_trial.test_journey_replay scripts.ncn_trial.test_activation scripts.ncn_trial.test_saved_paths scripts.ncn_trial.test_association_bundle scripts.ncn_trial.test_reference_reconciliation scripts.ncn_trial.test_catalogue_extract scripts.ncn_trial.test_extent_composition scripts.ncn_trial.test_access_evidence scripts.ncn_trial.test_extent_reference scripts.ncn_trial.test_cycling_saved_paths scripts.ncn_trial.test_national_discovery scripts.ncn_trial.test_route_memberships scripts.ncn_trial.test_numbered_reconciliation scripts.ncn_trial.test_physical_crosswalk -v
      - run: python -m unittest discover -s tests -p 'test_cycling_path_evidence.py' -v
      - run: python -m scripts.ncn_trial.run --output "$RUNNER_TEMP/ncn-route1"
      - run: python -m scripts.ncn_trial.association_bundle --output "$RUNNER_TEMP/ncn-associations"
