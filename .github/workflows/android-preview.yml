name: Android preview APK

on:
  push:
    branches:
      - codex/android-achievements-preview
    paths:
      - "android-prototype/**"
      - "canonical-a-roads-v5/**"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Run Android tests and build preview APK
        working-directory: android-prototype
        run: gradle :app:testPreviewDebugUnitTest :app:assemblePreviewDebug --no-daemon

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Roadprints-0.25.68-preview
          path: android-prototype/app/build/outputs/apk/preview/debug/app-preview-debug.apk
          if-no-files-found: error
          retention-days: 14
