name: Bulk settlement trial checks

on:
  pull_request:
    paths:
      - scripts/*bulk_settlement*trial*
      - scripts/requirements-bulk-settlement-trial.txt
      - .github/workflows/bulk-settlement-trial-checks.yml
  push:
    branches: [main]
    paths:
      - scripts/*bulk_settlement*trial*
      - scripts/requirements-bulk-settlement-trial.txt
      - .github/workflows/bulk-settlement-trial-checks.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-bulk-settlement-trial.txt
      - run: python -m unittest discover -s scripts -p test_bulk_settlement_inventory_trial.py
