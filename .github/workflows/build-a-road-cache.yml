name: Build A-road cache

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_a_road_cache.py"
      - "scripts/build_os_open_roads_a_cache.py"
      - ".github/workflows/build-a-road-cache.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: a-road-cache-builder
  cancel-in-progress: false

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build official Great Britain references
        id: build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/build_os_open_roads_a_cache.py
          git add canonical-a-roads-v4 || true
          CHANGED=false
          if ! git diff --cached --quiet; then
            git commit -m "Build official Great Britain A-road references"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            CHANGED=true
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
