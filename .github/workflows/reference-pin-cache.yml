name: Seed verified offline Android reference pins
# Preparation only: registration, draft upload and manual execution require separate approval.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed PR 222 source SHA (40 lowercase hexadecimal characters)
        required: true
        type: string
      release_tag:
        description: Private draft release containing the approved reference ZIP (alternative to artifact inputs)
        required: false
        type: string
      run_id:
        description: Existing same-repository run holding a verified reference artifact
        required: false
        type: string
      artifact_name:
        description: Existing artifact containing root catalogue.db and boundaries.bin
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: reference-pin-cache-bootstrap
  cancel-in-progress: false
jobs:
  seed:
    # Default-branch scope is readable by subsequent builds and PR branches.
    if: github.actor == github.repository_owner && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate explicit inputs without network access
        id: controls
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REFERENCE_RUN_ID: ${{ inputs.run_id }}
          REFERENCE_ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch('[a-f0-9]{40}',os.environ['SOURCE_SHA']):raise ValueError('Reviewed source SHA required')
          release=bool(os.environ['RELEASE_TAG'])
          artifact=bool(os.environ['REFERENCE_RUN_ID']) and bool(os.environ['REFERENCE_ARTIFACT'])
          if release==artifact:raise ValueError('Provide one release tag OR a run ID and artifact name')
          if release and (os.environ['REFERENCE_RUN_ID'] or os.environ['REFERENCE_ARTIFACT']):raise ValueError('Mixed source inputs')
          if release and not re.fullmatch('[A-Za-z0-9._-]{1,100}',os.environ['RELEASE_TAG']):raise ValueError('Invalid release tag')
          if artifact and not re.fullmatch('[0-9]+',os.environ['REFERENCE_RUN_ID']):raise ValueError('Invalid artifact run ID')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('release='+str(release).lower()+'\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify offline build controls
        run: python3 scripts/verify_offline_build_controls.py
      - name: Stage the approved private draft GitHub release bundle
        if: steps.controls.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/stage_github_reference_bundle.py --release-tag "$RELEASE_TAG"
      - name: Restore an existing GitHub artifact instead
        if: steps.controls.outputs.release != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: reference-input
      - name: Verify exact pins before artifact or cache publication
        run: python3 scripts/seed_reference_pins.py --source-directory reference-input
      - name: Retain the verified root-level reference artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roadprints-reference-pins-v2
          path: |
            reference-input/catalogue.db
            reference-input/boundaries.bin
          if-no-files-found: error
          retention-days: 90
      - name: Save verified reference pins
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/ncn/catalogue.db
            android-prototype/app/src/main/assets/historic-counties/boundaries.bin
          key: reference-pins-v2-${{ runner.os }}-${{ hashFiles('android-prototype/app/src/main/assets/ncn-national/manifest.json', 'android-prototype/app/src/main/assets/historic-counties/catalogue.json') }}
      - name: Remove only the two installed pin files before restore verification
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          for path in ('.cache/ncn/catalogue.db','android-prototype/app/src/main/assets/historic-counties/boundaries.bin'):
              Path(path).unlink(missing_ok=True)
          PYTHON
      - name: Restore exactly the saved key into empty local pin paths
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/ncn/catalogue.db
            android-prototype/app/src/main/assets/historic-counties/boundaries.bin
          key: reference-pins-v2-${{ runner.os }}-${{ hashFiles('android-prototype/app/src/main/assets/ncn-national/manifest.json', 'android-prototype/app/src/main/assets/historic-counties/catalogue.json') }}
          fail-on-cache-miss: true
      - name: Revalidate cached pins without Android execution
        run: |
          python3 scripts/prepare_ncn_reference.py
          bash android-prototype/scripts/prepare_county_reference.sh
