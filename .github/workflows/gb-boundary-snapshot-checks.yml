name: GB boundary snapshot checks

on:
  pull_request:
    paths:
      - scripts/*freeze_gb_settlement_boundaries.py
      - scripts/normalise_gb_boundary_snapshot.py
      - .github/workflows/gb-boundary-snapshot-checks.yml
  push:
    branches: [main]
    paths:
      - scripts/*freeze_gb_settlement_boundaries.py
      - scripts/normalise_gb_boundary_snapshot.py
      - .github/workflows/gb-boundary-snapshot-checks.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-bulk-settlement-trial.txt
      - run: python -m unittest discover -s scripts -p test_freeze_gb_settlement_boundaries.py
