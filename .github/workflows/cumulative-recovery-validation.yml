name: Build 292 cumulative coverage recovery
on:
  push:
    branches: [fix/cumulative-road-coverage-291-recovery]
    paths:
      - .github/workflows/cumulative-recovery-validation.yml
      - android-prototype/**
      - scripts/check_network_only_recovery.sh
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cumulative-recovery-${{ github.sha }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: adamdbird-gfc/uk-road-tracker
      APK: Roadprints-0.25.246-292.apk
      TAG: roadprints-0.25.246-292
      CERT_SHA256: 5b7cdba0abd0cb41d570cdc348e3ca9bb8e2312cb7adf568bb536ce8577cc031
      JAVA_TOOL_OPTIONS: -XX:TieredStopAtLevel=1
      NCN_TEST_DATABASE: ${{ github.workspace }}/.cache/ncn/catalogue.db
      MILEPOST_CANDIDATE_CATALOGUE: ${{ github.workspace }}/reference-data/millennium-mileposts/revision-1/catalogue.jsonl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Restore the released reference and record source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5f9ef9492643f05f4b1c19cec3d13bbf69041c79 "$GITHUB_SHA"
          gh release download roadprints-0.25.245-291 --pattern Roadprints-0.25.245-291.apk --output "$RUNNER_TEMP/build291.apk"
          echo "f2220aed2421f055300d33181d354731a5fca2edf7b2004a992c3a6c715e2960  $RUNNER_TEMP/build291.apk" | sha256sum --check
          assets=android-prototype/app/src/main/assets
          for asset in historic-counties/boundaries.bin railway/national.json railway/national.sqlite.gzip; do
            unzip -p "$RUNNER_TEMP/build291.apk" "assets/$asset" > "$assets/$asset"
          done
          unzip -p "$RUNNER_TEMP/build291.apk" assets/uk-road-reference-v1.bin > "$RUNNER_TEMP/uk-road-reference-v1.bin"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Extract bounded pinned reference for JVM tests
        run: |
          python - <<'PYTHON'
          import os,pathlib,struct
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'uk-road-reference-v1.bin'
          target=pathlib.Path('android-prototype/app/src/main/assets/uk-road-reference-v1.bin')
          with source.open('rb') as r:
              header=r.read(40)
              assert header[:8]==b'RPRD0002'
              count,=struct.unpack('>i',r.read(4))
              rows=list(struct.iter_unpack('>iiii',r.read(count*16)))
              rows=[e for e in rows if 17<=e[0]<=20 and 2570<=e[1]<=2573]
              assert rows
              with target.open('wb') as w:
                  w.write(header+struct.pack('>i',len(rows)))
                  offset=44+16*len(rows)
                  for x,y,_,size in rows:
                      w.write(struct.pack('>iiii',x,y,offset,size));offset+=size
                  for _,_,offset,size in rows:
                      r.seek(offset);w.write(r.read(size))
          PYTHON
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/ncn/catalogue.db
          key: reference-pins-v2-${{ runner.os }}-${{ hashFiles('android-prototype/app/src/main/assets/ncn-national/manifest.json', 'android-prototype/app/src/main/assets/historic-counties/catalogue.json') }}
      - name: Restore and verify the pinned NCN test database
        run: |
          python - <<'PYTHON'
          import gzip,hashlib,json,os,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('android-prototype/app/src/main/assets/ncn-national/manifest.json').read_text())
          target=pathlib.Path(os.environ['NCN_TEST_DATABASE'])
          def valid(path, digest, size):
              if not path.is_file() or path.stat().st_size!=size:
                  return False
              with path.open('rb') as source:
                  return hashlib.file_digest(source,'sha256').hexdigest()==digest
          if not valid(target,manifest['sha256'],manifest['database_bytes']):
              target.parent.mkdir(parents=True,exist_ok=True)
              packed=pathlib.Path(os.environ['RUNNER_TEMP'])/'pinned-ncn.db.gz'
              url='https://roadprints-data-822cc.web.app/'+manifest['filename']
              with urllib.request.urlopen(url,timeout=90) as source, packed.open('wb') as out:
                  total=0
                  while chunk:=source.read(1024*1024):
                      total+=len(chunk)
                      assert total<=manifest['compressed_bytes'],'NCN response exceeds pinned size'
                      out.write(chunk)
              assert valid(packed,manifest['compressed_sha256'],manifest['compressed_bytes'])
              with gzip.open(packed,'rb') as source,target.open('wb') as out:
                  total=0
                  while chunk:=source.read(1024*1024):
                      total+=len(chunk)
                      assert total<=manifest['database_bytes'],'NCN expansion exceeds pinned size'
                      out.write(chunk)
          assert valid(target,manifest['sha256'],manifest['database_bytes'])
          print('Verified exact pinned NCN test database',manifest['sha256'])
          PYTHON
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
          cache-read-only: true
      - name: Run complete Android JVM suite
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:testDebugUnitTest
      - name: Build the signed recovery and controlled reference-lifetime comparison
        env:
          ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
          ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
          ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
          ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROADPRINTS_DEBUG_KEYSTORE_B64"
          test -n "$ROADPRINTS_DEBUG_STORE_PASSWORD"
          test -n "$ROADPRINTS_DEBUG_KEY_ALIAS"
          test -n "$ROADPRINTS_DEBUG_KEY_PASSWORD"
          cp "$RUNNER_TEMP/uk-road-reference-v1.bin" android-prototype/app/src/main/assets/
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/roadprints-debug.keystore"
          source=android-prototype/app/src/main/java/com/roadprints/capture/LocalRoadCoverage.java
          cp "$source" "$RUNNER_TEMP/LocalRoadCoverage.fixed.java"
          cleanup() {
            cp "$RUNNER_TEMP/LocalRoadCoverage.fixed.java" "$source"
            rm -f "$ROADPRINTS_DEBUG_KEYSTORE"
          }
          trap cleanup EXIT
          umask 077
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$ROADPRINTS_DEBUG_KEYSTORE"
          unset ROADPRINTS_DEBUG_KEYSTORE_B64
          git show 12d0b98c675090325a019b4c7a7f702febe44eed:"$source" > "$source"
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:assembleDebug
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/network-reference-before.apk"
          cp "$RUNNER_TEMP/LocalRoadCoverage.fixed.java" "$source"
          git diff --exit-code -- "$source"
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:assembleDebug
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$APK"
      - name: Verify signed identities and data-preserving asset lineage
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in "$RUNNER_TEMP/build291.apk" "$RUNNER_TEMP/network-reference-before.apk" "$RUNNER_TEMP/$APK"; do
            "$signer" verify --print-certs "$apk" | grep -F "certificate SHA-256 digest: $CERT_SHA256"
          done
          "${signer%/*}/aapt" dump badging "$RUNNER_TEMP/$APK" | grep -F "package: name='com.roadprints.capture' versionCode='292' versionName='0.25.246'"
          python scripts/verify_milepost_apk.py "$RUNNER_TEMP/$APK"
          python - "$RUNNER_TEMP/$APK" "$RUNNER_TEMP/build291.apk" <<'PYTHON'
          import hashlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as update,zipfile.ZipFile(sys.argv[2]) as baseline:
              for old in baseline.infolist():
                  if not old.filename.startswith('assets/') or old.is_dir() or old.filename=='assets/release-notes.json':
                      continue
                  with baseline.open(old.filename) as source, update.open(old.filename) as packaged:
                      assert hashlib.file_digest(source,'sha256').digest()==hashlib.file_digest(packaged,'sha256').digest(),old.filename
              assert update.getinfo('assets/uk-road-reference-v1.bin').compress_type==zipfile.ZIP_STORED
          PYTHON
          echo "APK_SHA256=$(sha256sum "$RUNNER_TEMP/$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Enable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the integrated Map on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          heap-size: 256M
          disable-animations: true
          script: bash scripts/check_network_only_recovery.sh
      - name: Retain test results and runtime logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cumulative-recovery-validation
          path: |
            android-prototype/app/build/test-results/testDebugUnitTest/
            ${{ runner.temp }}/network-recovery*.log
            ${{ runner.temp }}/network-recovery*.png
            ${{ runner.temp }}/network-recovery*.xml
          if-no-files-found: warn
          retention-days: 30
      - name: Publish the validated owner upgrade
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)" = "$GITHUB_SHA"
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Integrated Roadprints 0.25.246 (292) owner upgrade.
          The overview shows motorway and A-road reference coverage plus cumulative black minor-road sections.
          Validated with the complete Android JVM suite and a signed upgrade from build 291 on Android API 35.
          The corrected Android runtime passed 1,600 synthetic journey checks; negative-control read failures are captured if observed, but the original Pixel 10 cause remains unconfirmed.
          Canonical contributor summary, individual journey navigation, archive preservation, cold and warm Map checks passed.
          Pixel 10 / Android 17 owner acceptance is pending.
          Source $GITHUB_SHA.
          APK SHA-256 $APK_SHA256.
          NOTES
          gh release create "$TAG" "$RUNNER_TEMP/$APK" --target "$GITHUB_SHA" --prerelease --latest=false             --title "Roadprints 0.25.246 (292)" --notes-file "$RUNNER_TEMP/release-notes.md"
          asset_url=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.assets[] | select(.name=="Roadprints-0.25.246-292.apk" and .state=="uploaded") | .browser_download_url')
          test "$asset_url" = "https://github.com/$GH_REPO/releases/download/$TAG/$APK"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 "$asset_url" --output "$RUNNER_TEMP/downloaded-owner.apk"
          cmp "$RUNNER_TEMP/$APK" "$RUNNER_TEMP/downloaded-owner.apk"
          printf '%s\n' "Source $GITHUB_SHA" "APK SHA-256 $APK_SHA256" "$asset_url" >> "$GITHUB_STEP_SUMMARY"
