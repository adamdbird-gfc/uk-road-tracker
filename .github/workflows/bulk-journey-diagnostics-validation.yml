name: Bulk journey diagnostics Android validation

on:
  push:
    branches: [feat/android-bulk-journey-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android compiler SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test diagnostics, backup and Map behavior
        working-directory: android-prototype
        run: |
          gradle --no-daemon --stacktrace :app:testAcceptanceUnitTest \
            --tests '*BulkJourneyDiagnosticsTest' \
            --tests '*JourneyDebugExporterTest' \
            --tests '*RoadprintsBackupTest' \
            --tests '*MapGeometryEvidenceExportTest' \
            --tests '*MapRecoveryEngineeringTest' \
            --tests '*CumulativePreparedOverviewSnapshotTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-journey-diagnostics-test-results
          path: android-prototype/app/build/test-results/testAcceptanceUnitTest
          retention-days: 7
