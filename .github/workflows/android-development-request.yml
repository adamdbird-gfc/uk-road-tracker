name: Private Android development APK
on:
  push:
    branches: [fix/ncn-ui-private-development, fix/android-ncn-responsiveness, fix/android-history-stabilisation, fix/android-map-contributions, fix/multimodal-ferry-stabilisation, fix/disneyland-gps-integrity, fix/generalised-journey-intelligence, fix/contextual-journey-actions]
    paths: ['.github/development-request.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    uses: ./.github/workflows/build-android-prototype.yml
    with:
      source_ref: ${{ github.sha }}
      firebase_upload: false
      distribute_existing_testers: false
    secrets: inherit
