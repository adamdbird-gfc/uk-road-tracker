name: Stage 11.1 corrective validation and private APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'android-prototype/**'
      - '.github/workflows/stage11-1-corrective-apk.yml'
permissions:
  contents: read
concurrency:
  group: milepost-stage11-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'fix/stage11-1-stability-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MILEPOST_CANDIDATE_CATALOGUE: ${{ github.workspace }}/reference-data/millennium-mileposts/revision-1/catalogue.jsonl
      ANDROID_SDK_DISABLE_USAGE_TRACKING: '1'
      NCN_TEST_DATABASE: ${{ github.workspace }}/.cache/ncn/catalogue.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Restore the same exact reference cache as Android builds
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/ncn/catalogue.db
            android-prototype/app/src/main/assets/historic-counties/boundaries.bin
          key: reference-pins-v2-${{ runner.os }}-${{ hashFiles('android-prototype/app/src/main/assets/ncn-national/manifest.json', 'android-prototype/app/src/main/assets/historic-counties/catalogue.json') }}
          fail-on-cache-miss: true
      - name: Verify restored reference bytes against packaged source pins
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          county=json.loads(pathlib.Path('android-prototype/app/src/main/assets/historic-counties/catalogue.json').read_text())
          ncn=json.loads(pathlib.Path('android-prototype/app/src/main/assets/ncn-national/manifest.json').read_text())
          for file,digest,size in (
              ('android-prototype/app/src/main/assets/historic-counties/boundaries.bin',county['data_sha256'],None),
              ('.cache/ncn/catalogue.db',ncn['sha256'],ncn['database_bytes']),
          ):
              path=pathlib.Path(file)
              assert path.is_file(),f'Missing pinned reference: {file}'
              if size is not None: assert path.stat().st_size==size,f'Invalid size: {file}'
              assert hashlib.file_digest(path.open('rb'),'sha256').hexdigest()==digest,f'Invalid SHA-256: {file}'
              print('Verified pinned reference:',file)
          PY
      - name: Require existing runner SDK and Java 17
        run: |
          test -n "$JAVA_HOME_17_X64" || { echo '::error::Runner Java 17 missing; no installation attempted.'; exit 1; }
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo '::error::Runner Android SDK 35 missing; no SDK download allowed.'; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - name: Restore Gradle tooling and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
          cache-read-only: true
      # Approval for this run must include ordinary Gradle/Maven dependency resolution.
      # Reference data remains cache-only; Android Test workers reject reference HTTP.
      - name: Compile and lint with SDK downloads disabled
        run: |
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:compileDebugJavaWithJavac :app:lintDebug :app:compileDebugUnitTestJavaWithJavac :app:compileReleaseJavaWithJavac :app:compileAcceptanceJavaWithJavac :app:compileAcceptanceUnitTestJavaWithJavac :app:compileAcceptanceAndroidTestJavaWithJavac :app:lintAcceptance
      - name: Resolve the three required Robolectric test fixtures before isolation
        run: |
          mkdir -p "$RUNNER_TEMP/robolectric-offline"
          cat > "$RUNNER_TEMP/robolectric-fixtures.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              def app = gradle.rootProject.project(':app')
              // Resolve each SDK separately; one configuration would select only the newest version.
              def sdks = [
                  'org.robolectric:android-all-instrumented:9-robolectric-4913185-2-i7',
                  'org.robolectric:android-all-instrumented:13-robolectric-9030017-i7',
                  'org.robolectric:android-all-instrumented:15-robolectric-12650502-i7'
              ].collect { coordinate ->
                  def files = app.configurations.detachedConfiguration(app.dependencies.create(coordinate))
                  files.transitive = false
                  files
              }
              app.tasks.register('prepareRobolectricOffline', Copy) {
                  from(sdks)
                  into(new File(System.getenv('RUNNER_TEMP'), 'robolectric-offline'))
              }
          }
          GRADLE
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false --init-script "$RUNNER_TEMP/robolectric-fixtures.init.gradle" :app:prepareRobolectricOffline
      - name: Run focused regression tests without external network access
        run: |
          cat > "$RUNNER_TEMP/milepost-heap.init.gradle" <<'GRADLE'
          allprojects {
              tasks.withType(Test).configureEach { maxHeapSize = '256m' }
          }
          GRADLE
          gradle_path="$(command -v gradle)"
          sudo --preserve-env=JAVA_HOME,ANDROID_HOME,ANDROID_SDK_ROOT,GRADLE_USER_HOME,RUNNER_TEMP,NCN_TEST_DATABASE,MILEPOST_CANDIDATE_CATALOGUE unshare --net bash -c '
            set -e
            ip link set lo up
            exec sudo -u runner --preserve-env=JAVA_HOME,ANDROID_HOME,ANDROID_SDK_ROOT,GRADLE_USER_HOME,RUNNER_TEMP,NCN_TEST_DATABASE,MILEPOST_CANDIDATE_CATALOGUE "$1" --offline --no-daemon --stacktrace --init-script "$RUNNER_TEMP/milepost-heap.init.gradle" -p android-prototype -Pandroid.builder.sdkDownload=false -Drobolectric.offline=true -Drobolectric.dependency.dir="$RUNNER_TEMP/robolectric-offline" :app:testDebugUnitTest --tests "*Milepost*Test" --tests "*WalkingCaptureEvidenceTest" --tests "*CaptureQualityValidatorTest" --tests "*Timeline*Test" --tests "*AchievementArchiveVolumeTest" --tests "*AchievementGeometrySpoolTest" --tests "*MapLegendTest" --tests "*AchievementCelebrationsTest" --tests "*AchievementGeometryMemoryTest" --tests "*CaptureRecoveryIntegrationTest" --tests "*CaptureMovementEvidenceTest" --tests "*WalkingCaptureServiceTest" --tests "*JourneyStoreDeletionTest" --tests "*JourneyStoreSummaryTest" --tests "*JourneyCorrectionUtilsTest" --tests "*NcnAndroidTest" --tests "*NcnAchievementThresholdTest" --tests "*PhantomTrain*Test" --tests "*DrivingTransition*Test" --tests "*OnFootContinuity*Test" --tests "*MultimodalFerryTest" --tests "*CaptureStartGateTest" --tests "*FootTraceValidatorTest"
          ' _ "$gradle_path"
      - name: Validate acceptance sandbox on Robolectric (not device evidence)
        run: |
          gradle --offline --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false -Drobolectric.offline=true -Drobolectric.dependency.dir="$RUNNER_TEMP/robolectric-offline" :app:testAcceptanceUnitTest --tests '*MilepostAcceptanceHarnessTest'
          python3 scripts/milepost_acceptance_isolation.py --compiled
      - name: Measure streaming evaluator with a 64MiB JVM
        run: |
          cat > "$RUNNER_TEMP/milepost-memory.init.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              def app = gradle.rootProject.project(':app')
              app.tasks.register('milepostMemoryProbe', JavaExec) {
                  dependsOn app.tasks.named('compileDebugUnitTestJavaWithJavac')
                  classpath = app.tasks.named('testDebugUnitTest').get().classpath
                  mainClass = 'com.roadprints.capture.MilepostEvidenceVolumeTest'
                  maxHeapSize = '64m'
              }
          }
          GRADLE
          gradle --offline --no-daemon -p android-prototype -Pandroid.builder.sdkDownload=false --init-script "$RUNNER_TEMP/milepost-memory.init.gradle" :app:milepostMemoryProbe
      - name: Validate Stage 1 catalogue and test counts
        run: |
          python3 -m unittest scripts.test_milepost_catalogue scripts.test_milepost_approval -q
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          roots=[E.parse(p).getroot() for p in pathlib.Path('android-prototype/app/build/test-results').rglob('TEST-*.xml')]
          assert roots
          totals={k:sum(int(r.attrib.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          print(totals)
          for root in roots:
              for out in root.iter('system-out'):
                  for line in (out.text or '').splitlines():
                      if any(tag in line for tag in ('MILEPOST_LEDGER_PROBE','MILEPOST_RECONCILE_PROBE','MILEPOST_ACHIEVEMENT_PROBE','MILEPOST_PRESENTATION_PROBE','MILEPOST_PRESENTATION_VIEW_PROBE','MILEPOST_INTEGRATION_PROBE')): print(line)
          assert totals['tests']>=40 and totals['failures']==totals['errors']==totals['skipped']==0
          PY
      - name: Run complete ordinary Android regression suite
        run: |
          gradle --offline --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false -Drobolectric.offline=true -Drobolectric.dependency.dir="$RUNNER_TEMP/robolectric-offline" :app:testDebugUnitTest --rerun-tasks
          python3 -m unittest scripts.test_review_capture_partition -q
          python3 - <<'PYTOTAL'
          import pathlib,xml.etree.ElementTree as E,json
          roots=[E.parse(p).getroot() for p in pathlib.Path('android-prototype/app/build/test-results').rglob('TEST-*.xml')]
          totals={k:sum(int(r.attrib.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          skips=[(r.attrib.get('name'),c.attrib.get('name')) for r in roots for c in r.findall('testcase') if c.find('skipped') is not None]
          print(json.dumps(dict(totals,skipped_cases=skips),sort_keys=True))
          assert totals['tests']>=850 and totals['failures']==totals['errors']==0,totals
          allowed={'com.roadprints.capture.'+name for name in ('NcnBindingCandidateTest','NcnOrdinarySeamCandidateTest','NcnChapelCandidateTest','NcnFiveCaseCandidateTest','NcnDealCorrespondenceCandidateTest')}
          assert len(skips)==10 and all(n in allowed for n,t in skips),skips
          PYTOTAL
      - name: Retain reports without APKs or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milepost-stage11-validation
          path: |
            android-prototype/app/build/reports/
            android-prototype/app/build/test-results/
          if-no-files-found: warn
          retention-days: 90
      - name: Validate authorised merged release request
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PYREQUEST'
          import json,pathlib,subprocess
          r=json.loads(pathlib.Path('.github/release-requests/android/0.25.225.json').read_text())
          assert r==dict(schema_version=1,version_name='0.25.225',version_code=271,baseline='98107ae1c984749d5e2917d7633a821a33d60618',firebase_upload=False,distribute_existing_testers=False)
          subprocess.run(['git','merge-base','--is-ancestor',r['baseline'],'HEAD'],check=True)
          PYREQUEST
      - name: Assemble one update using the established stable signing key
        if: github.event_name == 'pull_request'
        env:
          ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
          ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
          ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
          ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROADPRINTS_DEBUG_KEYSTORE_B64"
          test -n "$ROADPRINTS_DEBUG_STORE_PASSWORD"
          test -n "$ROADPRINTS_DEBUG_KEY_ALIAS"
          test -n "$ROADPRINTS_DEBUG_KEY_PASSWORD"
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/roadprints-debug.keystore"
          trap 'rm -f "$ROADPRINTS_DEBUG_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$ROADPRINTS_DEBUG_KEYSTORE"
          gradle --offline --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:assembleDebug
          mkdir -p private-apk
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk private-apk/Roadprints-0.25.225-271.apk
      - name: Verify update identity, certificate and immutable artifact receipt
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          apk=private-apk/Roadprints-0.25.225-271.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs "$apk" | tee private-apk/certificate.txt
          grep -Fq 'certificate SHA-256 digest: 5b7cdba0abd0cb41d570cdc348e3ca9bb8e2312cb7adf568bb536ce8577cc031' private-apk/certificate.txt
          python3 scripts/verify_milepost_apk.py "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          "$aapt" dump badging "$apk" > private-apk/package.txt
          grep -Fq "package: name='com.roadprints.capture' versionCode='271' versionName='0.25.225'" private-apk/package.txt
          python3 - <<'PYAPK'
          import hashlib,json,os,pathlib,subprocess
          os.environ['SOURCE_SHA']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          p=pathlib.Path('private-apk/Roadprints-0.25.225-271.apk')
          receipt=dict(schema_version=1,source_sha=os.environ['SOURCE_SHA'],run_id=os.environ['GITHUB_RUN_ID'],application_id='com.roadprints.capture',version_name='0.25.225',version_code=271,bytes=p.stat().st_size,sha256=hashlib.file_digest(p.open('rb'),'sha256').hexdigest(),certificate_sha256='5b7cdba0abd0cb41d570cdc348e3ca9bb8e2312cb7adf568bb536ce8577cc031',firebase_distribution=False,device_acceptance=False,workflow='stage11-1-corrective-apk.yml',catalogue_revision=3,catalogue_sha256='1f7468a5ed054c5822c88614650fe33814554502a57779fc1b7375749d35c2ce')
          pathlib.Path('private-apk/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PYAPK
      - name: Retain signed APK and public verification receipt for owner download
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roadprints-mileposts-0.25.225-271
          path: private-apk/
          if-no-files-found: error
          retention-days: 90
