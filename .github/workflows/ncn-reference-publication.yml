name: Publish versioned NCN reference
# Recovered from infra/ncn-publication; existing Hosting identity and lock only.
on:
  pull_request:
    paths:
      - '.github/workflows/ncn-reference-publication.yml'
      - '.github/ncn-reference/request.json'
      - 'scripts/*ncn_publication*'
      - 'scripts/publish_ncn_reference.py'
      - 'scripts/test_ncn_reference.py'
  push:
    branches: [main]
    paths: ['.github/ncn-reference/request.json']
permissions:
  contents: read
concurrency:
  group: firebase-reference-publication
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Offline publication contract and quota tests
        env: {PYTHONPATH: scripts}
        run: |
          python -m unittest scripts.test_ncn_reference scripts.test_ncn_publication_quota -v
          python -m py_compile scripts/prepare_ncn_publication.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.github/ncn-reference/request.json').read_text())
          m=json.loads(Path('docs/data-trials/ncn-publication-readiness-20261104/candidate-manifest.json').read_text())
          assert r=={'action':'publish','revision':m['revision'],'database_sha256':m['sha256'],'compressed_sha256':m['compressed_sha256'],'source_baseline':'2ae2b89276f5541bf5c13d61c6371a5cbc7c2c6e'}
          PY
  publish:
    needs: offline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install google-auth==2.40.3 requests==2.32.5 -r requirements-ncn-deal.txt
      - name: Verify existing Hosting identity and current project quota before transfers
        env:
          FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON }}
          ROADPRINTS_DATA_HOSTING_SITE: ${{ vars.ROADPRINTS_DATA_HOSTING_SITE }}
        run: python scripts/check_ncn_publication_quota.py
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/ncn/catalogue.db
            android-prototype/app/src/main/assets/historic-counties/boundaries.bin
          key: reference-pins-v2-${{ runner.os }}-${{ hashFiles('android-prototype/app/src/main/assets/ncn-national/manifest.json', 'android-prototype/app/src/main/assets/historic-counties/catalogue.json') }}
          fail-on-cache-miss: true
      - name: Reuse verified reference cache and exact candidate pins offline
        run: python -m scripts.prepare_ncn_publication
      - name: Enforce unchanged live baseline before publication
        run: |
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          url='https://roadprints-data-822cc.web.app/collections/published/ncn/manifest-v2.json'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise ValueError('Unexpected manifest redirect')
          with urllib.request.build_opener(NoRedirect()).open(url,timeout=60) as r:
              raw=r.read(32769)
          assert len(raw)<=32768
          assert json.loads(raw)==json.loads(Path('docs/data-trials/ncn-publication-readiness-20261104/live-manifest.json').read_text()), 'Live base changed; stop'
          PY
      - name: One verified preview then promote identical version through existing publisher
        env:
          FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON }}
          ROADPRINTS_DATA_HOSTING_SITE: ${{ vars.ROADPRINTS_DATA_HOSTING_SITE }}
        run: >-
          python scripts/publish_ncn_reference.py
          --asset ncn-publication-evidence/candidate/catalogue.db.gz
          --manifest ncn-publication-evidence/candidate/manifest.json
          --work ncn-publication-evidence/hosting --promote
      - name: Retain access, quota, publication and rollback source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncn-publication-revision-4-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            ncn-publication-evidence/quota.json
            ncn-publication-evidence/hosting/*.json
            ncn-publication-evidence/candidate/manifest.json
