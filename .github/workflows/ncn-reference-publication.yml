name: Publish versioned NCN reference
on:
  push:
    branches: [infra/ncn-publication]
    paths: ['.github/ncn-reference/request.json']
  workflow_dispatch:
    inputs:
      asset_url:
        description: HTTPS location of the prepared catalogue.db.gz (must match committed manifest)
        required: true
        type: string
      promote:
        description: Promote the verified preview to live
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: firebase-reference-publication
  cancel-in-progress: false
jobs:
  verify-existing-access:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install google-auth==2.40.3 requests==2.32.5
      - name: Verify the original Hosting service-account credential and live assets
        env:
          FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON }}
          ROADPRINTS_DATA_HOSTING_SITE: ${{ vars.ROADPRINTS_DATA_HOSTING_SITE }}
        run: python scripts/verify_ncn_publication_access.py
      - uses: actions/upload-artifact@v4
        with:
          name: ncn-existing-publication-access
          path: ncn-publication-evidence/access.json
          retention-days: 7
  publish:
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install google-auth==2.40.3 requests==2.32.5
      - name: Test publication invariants
        run: python -m unittest discover -s scripts -p test_ncn_reference.py -v
      - name: Obtain prepared asset and check its pinned bytes
        env:
          NCN_ASSET_URL: ${{ inputs.asset_url }}
        run: |
          python - <<'PY'
          import json,os,sys,urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit
          sys.path.insert(0,'scripts')
          from ncn_reference import validate,sha_file
          m=validate(json.loads(Path('android-prototype/app/src/main/assets/ncn-national/manifest.json').read_text()))
          url=os.environ['NCN_ASSET_URL']
          p=urlsplit(url)
          if p.scheme!='https' or not p.hostname or p.username or p.password:raise ValueError('Expected HTTPS asset location')
          with urllib.request.urlopen(url,timeout=90)as source,open('catalogue.db.gz','wb')as target:
              if urlsplit(source.url).scheme!='https':raise ValueError('Insecure redirect')
              total=0
              for chunk in iter(lambda:source.read(65536),b''):
                  total+=len(chunk)
                  if total>m['compressed_bytes']:raise ValueError('Asset size exceeds pin')
                  target.write(chunk)
          if total!=m['compressed_bytes'] or sha_file('catalogue.db.gz')!=m['compressed_sha256']:raise ValueError('Asset differs from committed pin')
          PY
      - name: Clone live, add catalogue, verify preview and optionally promote
        env:
          FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON }}
          ROADPRINTS_DATA_HOSTING_SITE: ${{ vars.ROADPRINTS_DATA_HOSTING_SITE }}
          NCN_PROMOTE: ${{ inputs.promote }}
        run: |
          args=()
          if [[ "$NCN_PROMOTE" == "true" ]]; then args+=(--promote); fi
          python scripts/publish_ncn_reference.py --asset catalogue.db.gz --manifest android-prototype/app/src/main/assets/ncn-national/manifest.json "${args[@]}"
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncn-reference-publication-${{ github.sha }}
          path: ncn-publication-evidence/publication.json
          if-no-files-found: warn
          retention-days: 30
