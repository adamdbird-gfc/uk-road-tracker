name: Publish versioned NCN reference
on:
  push:
    branches: [infra/ncn-publication]
    paths: ['.github/ncn-reference/request.json']
  workflow_dispatch:
    inputs:
      asset_url:
        description: HTTPS location of the prepared catalogue.db.gz (must match committed manifest)
        required: false
        type: string
      drive_file_id:
        description: Prepared private catalogue shared with the existing Hosting service account (alternative to asset_url)
        required: false
        type: string
      promote:
        description: Promote the verified preview to live
        default: false
        type: boolean
      package_beta:
        description: After verified live publication, run all Android tests and package/distribute one beta
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: firebase-reference-publication
  cancel-in-progress: false
jobs:
  verify-existing-access:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      action: ${{ steps.request.outputs.action }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install google-auth==2.40.3 requests==2.32.5
      - name: Read publication request action
        id: request
        run: |
          python - <<'PYTHON'
          import json,os
          request=json.load(open('.github/ncn-reference/request.json'))
          action=request['action']
          if action not in ('verify-existing-access','publish'):raise ValueError('Unknown publication action')
          with open(os.environ['GITHUB_OUTPUT'],'a') as target:target.write('action='+action+'\n')
          PYTHON
      - name: Check Drive API availability for the existing deployment identity
        env:
          FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON }}
          ROADPRINTS_DATA_HOSTING_SITE: ${{ vars.ROADPRINTS_DATA_HOSTING_SITE }}
        run: python scripts/probe_ncn_drive_transport.py
      - uses: actions/upload-artifact@v4
        with:
          name: ncn-existing-publication-access
          path: ncn-publication-evidence/access.json
          retention-days: 7
  publish:
    needs: verify-existing-access
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.verify-existing-access.result == 'success' && needs.verify-existing-access.outputs.action == 'publish'))
    outputs:
      package_beta: ${{ steps.controls.outputs.package_beta }}
      promote: ${{ steps.controls.outputs.promote }}

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install google-auth==2.40.3 requests==2.32.5
      - name: Read requested release controls
        id: controls
        run: |
          python - <<'PYTHON'
          import json,os
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          request=event['inputs'] if os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' else json.load(open('.github/ncn-reference/request.json'))
          def flag(key):return str(request.get(key,False)).lower()=='true'
          if flag('package_beta') and not flag('promote'):raise ValueError('Beta packaging requires verified live publication')
          if bool(request.get('drive_file_id'))==bool(request.get('asset_url')):raise ValueError('Provide exactly one prepared input: Drive file ID or HTTPS URL')
          with open(os.environ['GITHUB_OUTPUT'],'a')as target:
              for key in ('promote','package_beta'):target.write(key+'='+str(flag(key)).lower()+'\n')
              target.write('transport='+('drive' if request.get('drive_file_id') else 'https')+'\n')
          PYTHON
      - name: Test publication invariants
        run: python -m unittest discover -s scripts -p test_ncn_reference.py -v
      - name: Download privately shared prepared catalogue with the existing identity
        if: steps.controls.outputs.transport == 'drive'
        env:
          FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON }}
        run: python scripts/download_ncn_drive_reference.py
      - name: Obtain prepared asset and check its pinned bytes
        if: steps.controls.outputs.transport == 'https'
        run: |
          python - <<'PY'
          import json,os,sys,urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit
          sys.path.insert(0,'scripts')
          from ncn_reference import validate,sha_file
          m=validate(json.loads(Path('android-prototype/app/src/main/assets/ncn-national/manifest.json').read_text()))
          # Read the dispatch input without echoing a possible signed URL in step env logs.
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          request=event['inputs'] if os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' else json.load(open('.github/ncn-reference/request.json'))
          url=request['asset_url']
          if os.environ['GITHUB_EVENT_NAME']=='push' and urlsplit(url).query:raise ValueError('Use manual dispatch for signed URLs; never commit them')
          p=urlsplit(url)
          if p.scheme!='https' or not p.hostname or p.username or p.password:raise ValueError('Expected HTTPS asset location')
          with urllib.request.urlopen(url,timeout=90)as source,open('catalogue.db.gz','wb')as target:
              if urlsplit(source.url).scheme!='https':raise ValueError('Insecure redirect')
              total=0
              for chunk in iter(lambda:source.read(65536),b''):
                  total+=len(chunk)
                  if total>m['compressed_bytes']:raise ValueError('Asset size exceeds pin')
                  target.write(chunk)
          if total!=m['compressed_bytes'] or sha_file('catalogue.db.gz')!=m['compressed_sha256']:raise ValueError('Asset differs from committed pin')
          PY
      - name: Clone live, add catalogue, verify preview and optionally promote
        env:
          FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_HOSTING_SERVICE_ACCOUNT_JSON }}
          ROADPRINTS_DATA_HOSTING_SITE: ${{ vars.ROADPRINTS_DATA_HOSTING_SITE }}
          NCN_PROMOTE: ${{ steps.controls.outputs.promote }}
        run: |
          args=()
          if [[ "$NCN_PROMOTE" == "true" ]]; then args+=(--promote); fi
          python scripts/publish_ncn_reference.py --asset catalogue.db.gz --manifest android-prototype/app/src/main/assets/ncn-national/manifest.json "${args[@]}"
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncn-reference-publication-${{ github.sha }}
          path: ncn-publication-evidence/publication.json
          if-no-files-found: warn
          retention-days: 30
  beta:
    needs: publish
    if: needs.publish.outputs.promote == 'true' && needs.publish.outputs.package_beta == 'true'
    uses: adamdbird-gfc/uk-road-tracker/.github/workflows/build-android-prototype.yml@fix/onboarding-start-tracking
    with:
      source_ref: ${{ github.sha }}
      firebase_upload: true
      distribute_existing_testers: true
    secrets: inherit
