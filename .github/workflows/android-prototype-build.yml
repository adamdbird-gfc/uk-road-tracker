name: Android prototype build

on:
  push:
    branches:
      - codex/matching-coordinator
      - fix/onboarding-start-tracking
    paths:
      - "android-prototype/**"
      - ".github/workflows/android-prototype-build.yml"
  pull_request:
    paths:
      - "android-prototype/**"
      - ".github/workflows/android-prototype-build.yml"
  workflow_dispatch:
    inputs:
      firebase_upload:
        description: Upload the verified signed APK to Firebase App Distribution
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
      ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
      ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
      ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"

      - name: Package pinned offline historic county reference
        run: bash android-prototype/scripts/prepare_county_reference.sh

      - name: Prepare stable debug signing key
        run: |
          test -n "$ROADPRINTS_DEBUG_KEYSTORE_B64" || { echo "Stable Roadprints signing key is not configured." >&2; exit 1; }
          test -n "$ROADPRINTS_DEBUG_STORE_PASSWORD" || { echo "Stable signing store password is not configured." >&2; exit 1; }
          test -n "$ROADPRINTS_DEBUG_KEY_ALIAS" || { echo "Stable signing key alias is not configured." >&2; exit 1; }
          test -n "$ROADPRINTS_DEBUG_KEY_PASSWORD" || { echo "Stable signing key password is not configured." >&2; exit 1; }
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/roadprints-debug.keystore"
          echo "ROADPRINTS_DEBUG_KEYSTORE=$RUNNER_TEMP/roadprints-debug.keystore" >> "$GITHUB_ENV"

      - name: Build, test and verify signed APK
        run: |
          gradle --no-daemon --stacktrace -p android-prototype :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-prototype/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p roadprints-output
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk roadprints-output/app-debug.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-android-debug-${{ github.sha }}
          path: roadprints-output/
          if-no-files-found: error
          retention-days: 7

  firebase:
    needs: build-debug-apk
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.firebase_upload) ||
      (github.event_name == 'push' && vars.ROADPRINTS_FIREBASE_UPLOAD == 'true' &&
      (github.ref == 'refs/heads/fix/onboarding-start-tracking' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out verified source
        uses: actions/checkout@v6

      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: roadprints-android-debug-${{ github.sha }}
          path: verified-apk

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.33.0

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/roadprints-firebase-credentials.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          python3 - <<'PY'
          import json, os, pathlib
          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON', '')
          if not raw:
              raise SystemExit('Configure the FIREBASE_SERVICE_ACCOUNT_JSON repository Actions secret first. See docs/android-firebase-distribution.md.')
          try:
              credentials = json.loads(raw)
          except ValueError:
              raise SystemExit('FIREBASE_SERVICE_ACCOUNT_JSON must contain valid service-account JSON.')
          if credentials.get('type') != 'service_account' or credentials.get('project_id') != 'roadprints-822cc' or not credentials.get('private_key') or not credentials.get('client_email'):
              raise SystemExit('Expected a service-account key for roadprints-822cc, not google-services.json.')
          path = pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS'])
          path.touch(mode=0o600, exist_ok=False)
          path.write_text(raw)
          PY
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          bash scripts/upload_android_firebase.sh verified-apk/app-debug.apk

      - name: Remove deployment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/roadprints-firebase-credentials.json"
