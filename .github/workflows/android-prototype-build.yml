name: Android checks

on:
  push:
    branches:
      - main
      - codex/matching-coordinator
      - fix/onboarding-start-tracking
    paths:
      - "android-prototype/**"
      - "collections/venue-collections-v1.json"
      - "scripts/generate_venue_collections.py"
      - "scripts/publish_venue_catalogue.py"
      - "scripts/test_venue_catalogue.py"
      - ".github/workflows/android-prototype-build.yml"
      - ".github/workflows/build-android-prototype.yml"
      - "scripts/upload_android_firebase.sh"
  pull_request:
    paths:
      - "android-prototype/**"
      - "collections/venue-collections-v1.json"
      - "scripts/generate_venue_collections.py"
      - "scripts/publish_venue_catalogue.py"
      - "scripts/test_venue_catalogue.py"
      - ".github/workflows/android-prototype-build.yml"
      - ".github/workflows/build-android-prototype.yml"
      - "scripts/upload_android_firebase.sh"

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Verify declarative venue registry
        run: |
          python3 scripts/generate_venue_collections.py --check
          python3 -m unittest discover -s scripts -p test_venue_catalogue.py

      - name: Package pinned offline historic county reference
        run: bash android-prototype/scripts/prepare_county_reference.sh

      - name: Check service catalogue metadata
        run: python3 scripts/test_service_collection_metadata.py

      - name: Run unit tests and lint
        run: gradle --no-daemon --stacktrace -p android-prototype :app:testDebugUnitTest :app:lintDebug

      - name: Upload failed-check reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports-${{ github.sha }}
          path: |
            android-prototype/app/build/reports/
            android-prototype/app/build/test-results/
          if-no-files-found: warn
          retention-days: 3
