name: Android prototype build

on:
  push:
    branches:
      - codex/matching-coordinator
    paths:
      - "android-prototype/**"
      - ".github/workflows/android-prototype-build.yml"
  pull_request:
    paths:
      - "android-prototype/**"
      - ".github/workflows/android-prototype-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
      ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
      ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
      ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"

      - name: Package pinned offline historic county reference
        run: bash android-prototype/scripts/prepare_county_reference.sh

      - name: Prepare stable debug signing key
        run: |
          test -n "$ROADPRINTS_DEBUG_KEYSTORE_B64" || { echo "Stable Roadprints signing key is not configured." >&2; exit 1; }
          test -n "$ROADPRINTS_DEBUG_STORE_PASSWORD" || { echo "Stable signing store password is not configured." >&2; exit 1; }
          test -n "$ROADPRINTS_DEBUG_KEY_ALIAS" || { echo "Stable signing key alias is not configured." >&2; exit 1; }
          test -n "$ROADPRINTS_DEBUG_KEY_PASSWORD" || { echo "Stable signing key password is not configured." >&2; exit 1; }
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/roadprints-debug.keystore"
          echo "ROADPRINTS_DEBUG_KEYSTORE=$RUNNER_TEMP/roadprints-debug.keystore" >> "$GITHUB_ENV"

      - name: Build, test and verify signed APK
        run: |
          gradle --no-daemon --stacktrace -p android-prototype :app:testDebugUnitTest :app:assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-prototype/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p roadprints-output
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk roadprints-output/app-debug.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-android-debug-${{ github.sha }}
          path: roadprints-output/
          if-no-files-found: error
          retention-days: 7
