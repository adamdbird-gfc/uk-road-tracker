name: Android checks

on:
  push:
    branches:
      - main
      - codex/matching-coordinator
      - fix/onboarding-start-tracking
    paths:
      - "android-prototype/**"
      - "collections/venue-collections-v1.json"
      - "scripts/generate_venue_collections.py"
      - "scripts/publish_venue_catalogue.py"
      - "scripts/test_venue_catalogue.py"
      - ".github/workflows/android-prototype-build.yml"
      - ".github/workflows/build-android-prototype.yml"
      - "scripts/upload_android_firebase.sh"
  pull_request:
    paths:
      - "android-prototype/**"
      - "collections/venue-collections-v1.json"
      - "scripts/generate_venue_collections.py"
      - "scripts/publish_venue_catalogue.py"
      - "scripts/test_venue_catalogue.py"
      - ".github/workflows/android-prototype-build.yml"
      - ".github/workflows/build-android-prototype.yml"
      - "scripts/upload_android_firebase.sh"

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify offline source build controls before preparing references
        run: python3 scripts/verify_offline_build_controls.py

      # Cache immutable pins across checks and packaging; a cold miss fails closed.
      - name: Restore pinned references without Firebase access
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/ncn/catalogue.db
            android-prototype/app/src/main/assets/historic-counties/boundaries.bin
          key: reference-pins-v2-${{ runner.os }}-${{ hashFiles('android-prototype/app/src/main/assets/ncn-national/manifest.json', 'android-prototype/app/src/main/assets/historic-counties/catalogue.json') }}
          fail-on-cache-miss: true

      - name: Verify both reference pins before build setup
        run: |
          python3 scripts/prepare_ncn_reference.py
          bash android-prototype/scripts/prepare_county_reference.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Verify declarative venue registry
        run: |
          python3 scripts/generate_venue_collections.py --check
          python3 -m unittest discover -s scripts -p test_venue_catalogue.py

      - name: Verify pinned service footprints
        run: |
          python3 -m pip install shapely==2.2.0
          python3 -m unittest discover -s scripts -p test_service_site_boundaries.py

      - name: Check service catalogue metadata
        run: python3 scripts/test_service_collection_metadata.py

      - name: Compile Android and lint independently of reference publication
        run: gradle --no-daemon --stacktrace -p android-prototype :app:compileDebugJavaWithJavac :app:lintDebug

      - name: Run national NCN fixtures against verified local reference
        id: ncn_reference
        run: |
          NCN_TEST_DATABASE="$PWD/.cache/ncn/catalogue.db" python3 scripts/test_ncn_national.py

      - name: Run integrated unit tests with verified external reference
        run: gradle --no-daemon --stacktrace -p android-prototype :app:testDebugUnitTest

      - name: Run offline regression suite when NCN publication is unavailable
        if: failure() && steps.ncn_reference.outcome == 'failure'
        run: gradle --no-daemon --stacktrace -p android-prototype :app:testDebugUnitTest -PncnOfflineChecks=true

      - name: Upload failed-check reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports-${{ github.sha }}
          path: |
            android-prototype/app/build/reports/
            android-prototype/app/build/test-results/
          if-no-files-found: warn
          retention-days: 3
