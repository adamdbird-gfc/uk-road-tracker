name: Build motorway cache

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_motorway_cache.py"
      - ".github/workflows/build-motorway-cache.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: motorway-cache-builder
  cancel-in-progress: false

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and checkpoint motorway batches
        id: build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CHANGED=false

          # Run two six-motorway batches during this Action.
          # Each invocation reads the cache produced by the previous one.
          for BATCH in 1 2
          do
            echo "========================================"
            echo "Starting batch $BATCH"
            echo "========================================"

            python scripts/build_motorway_cache.py

            git add canonical-motorways-v1.json

            if git diff --cached --quiet; then
              echo "No new cache data produced in batch $BATCH."
              break
            else
              git commit -m "Build canonical motorway cache batch $BATCH"
              git push
              CHANGED=true
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Queue next cache run
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Queueing the next resumable motorway-cache run..."
          gh workflow run build-motorway-cache.yml --ref "${GITHUB_REF_NAME}"
