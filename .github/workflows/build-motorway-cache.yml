name: Build motorway cache

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_motorway_cache.py"
      - ".github/workflows/build-motorway-cache.yml"
      - "canonical-motorways-v1.json"

permissions:
  contents: write

concurrency:
  group: motorway-cache-builder
  cancel-in-progress: false

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build next motorway cache batch
        run: python scripts/build_motorway_cache.py

      - name: Commit cache checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical-motorways-v1.json

          if git diff --cached --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "Build next canonical motorway cache batch"
            git push
          fi
