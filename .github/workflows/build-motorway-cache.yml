name: Build motorway cache

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_motorway_cache.py"
      - ".github/workflows/build-motorway-cache.yml"

permissions:
  contents: write

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build canonical motorway cache
        run: python scripts/build_motorway_cache.py

      - name: Commit generated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical-motorways-v1.json
          if git diff --cached --quiet; then
            echo "No cache changes to commit"
          else
            git commit -m "Build canonical motorway cache"
            git push
          fi
