name: Build Android capture prototype

on:
  workflow_dispatch:
  push:
    paths:
      - "android-prototype/**"
      - ".github/workflows/build-android-prototype.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Build debug APK
        run: gradle --no-daemon -p android-prototype assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
