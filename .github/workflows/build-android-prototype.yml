name: Build Android capture prototype

on:
  workflow_dispatch:
    inputs:
      firebase_upload:
        description: Upload the verified APK to Firebase App Distribution
        type: boolean
        default: false
  push:
    paths:
      - "android-prototype/**"
      - ".github/workflows/build-android-prototype.yml"
      - "scripts/upload_android_firebase.sh"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
      ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
      ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
      ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Verify service catalogue metadata rules
        run: python3 scripts/test_service_collection_metadata.py

      - name: Package pinned offline historic county reference
        run: bash android-prototype/scripts/prepare_county_reference.sh

      - name: Prepare stable debug signing key
        if: ${{ env.ROADPRINTS_DEBUG_KEYSTORE_B64 != '' }}
        run: |
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/roadprints-debug.keystore"

      - name: Build debug APK
        run: |
          test -f "$RUNNER_TEMP/roadprints-debug.keystore"
          if [ -z "$ROADPRINTS_DEBUG_STORE_PASSWORD" ] || [ -z "$ROADPRINTS_DEBUG_KEY_ALIAS" ] || [ -z "$ROADPRINTS_DEBUG_KEY_PASSWORD" ]; then
            echo "::error::Configure ROADPRINTS_DEBUG_STORE_PASSWORD, ROADPRINTS_DEBUG_KEY_ALIAS and ROADPRINTS_DEBUG_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/roadprints-debug.keystore"
          gradle --no-daemon -p android-prototype testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK signature and report test totals
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs android-prototype/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in glob.glob("android-prototype/app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print("Android test totals:", totals)
          assert totals["tests"] > 0 and totals["failures"] == totals["errors"] == 0
          PY

      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-verification-reports
          path: |
            android-prototype/app/build/reports/
            android-prototype/app/build/test-results/
            android-prototype/app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: warn
          retention-days: 14

      - name: Print lint errors
        if: failure()
        run: |
          report=android-prototype/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  firebase:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.firebase_upload) ||
      (vars.ROADPRINTS_FIREBASE_UPLOAD == 'true' &&
      (github.ref == 'refs/heads/feat/firebase-beta-measurement' || github.ref == 'refs/heads/feat/contextual-journey-capture' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out verified source
        uses: actions/checkout@v6

      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: verified-apk

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.33.0

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/roadprints-firebase-credentials.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          python3 - <<'PY'
          import json, os, pathlib
          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON', '')
          if not raw:
              raise SystemExit('Configure the FIREBASE_SERVICE_ACCOUNT_JSON repository Actions secret first. See docs/android-firebase-distribution.md.')
          try:
              credentials = json.loads(raw)
          except ValueError:
              raise SystemExit('FIREBASE_SERVICE_ACCOUNT_JSON must contain valid service-account JSON.')
          if credentials.get('type') != 'service_account' or credentials.get('project_id') != 'roadprints-822cc' or not credentials.get('private_key') or not credentials.get('client_email'):
              raise SystemExit('Expected a service-account key for roadprints-822cc, not google-services.json.')
          path = pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS'])
          path.touch(mode=0o600, exist_ok=False)
          path.write_text(raw)
          PY
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          bash scripts/upload_android_firebase.sh verified-apk/app-debug.apk

      - name: Remove deployment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/roadprints-firebase-credentials.json"

  publish:
    needs: build
    if: github.ref == 'refs/heads/feat/cycling-matcher' || github.ref == 'refs/heads/feat/firebase-beta-measurement' || github.ref == 'refs/heads/feat/contextual-journey-capture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@v6

      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: verified-apk

      - name: Publish versioned APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import re,pathlib; print(re.search(r"versionName = \"([^\"]+)\"", pathlib.Path("android-prototype/app/build.gradle.kts").read_text()).group(1))')
          tag="android-$version"
          cp verified-apk/app-debug.apk "$RUNNER_TEMP/roadprints-$version.apk"
          if [ "$GITHUB_REF_NAME" = "feat/contextual-journey-capture" ]; then
            cat > "$RUNNER_TEMP/android-release-notes.md" <<'NOTES'
          Contextual departure, travel, pause and arrival capture.
          Uses asynchronous cached public building, parking, road, rail and outdoor map evidence.
          Station dwell, rail departure and walking-away boundaries tolerate missing Android activity callbacks.
          Preserves uncertain mixed-mode travel for review and checkpoints pending context transitions.
          Includes sustained walk/run transitions and existing evidence-based service-station visits.
          Android tests, lint and stable APK signature verification run before publication.
          NOTES
          elif [ "$GITHUB_REF_NAME" = "feat/firebase-beta-measurement" ]; then
            cat > "$RUNNER_TEMP/android-release-notes.md" <<'NOTES'
          Signed Roadprints Android beta measurement update.
          Adds Firebase Analytics, Crashlytics and Performance Monitoring.
          Usage analytics and diagnostics are separate opt-in choices in Utilities.
          Advertising collection is disabled. Custom events exclude GPS routes and journey names.
          Includes capture, matching and import outcomes, screen views and loading timings.
          Adds a non-fatal diagnostic test button and internal tester cohort setting.
          Preserves the 0.25.170 drive-stop fixes, cycling and existing achievements.
          Android tests, lint and stable APK signature verification run before publication.
          NOTES
          else
          cat > "$RUNNER_TEMP/android-release-notes.md" <<'NOTES'
          Signed Roadprints Android cycling matcher test update.
          Cycling uses a dedicated bicycle matching profile for Timeline imports and capture.
          Supports automatic matching, retries, matched map display and cycling distance.
          Preserves GPS bends when reducing dense recordings. Original traces remain saved.
          Road and A-road completion credit is deferred until physical segment attribution is verified.
          Includes the existing achievements and map loading improvements.
          Android tests, lint and APK signature verification run before publication.
          NOTES
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" "$RUNNER_TEMP/roadprints-$version.apk" --target "$GITHUB_SHA" --title "Roadprints $version" --notes-file "$RUNNER_TEMP/android-release-notes.md" --prerelease --latest=false
          fi
