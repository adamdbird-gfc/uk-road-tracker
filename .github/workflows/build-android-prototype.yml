name: Build Android capture prototype

on:
  workflow_dispatch:
  push:
    paths:
      - "android-prototype/**"
      - ".github/workflows/build-android-prototype.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
      ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
      ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
      ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Prepare stable debug signing key
        if: ${{ env.ROADPRINTS_DEBUG_KEYSTORE_B64 != '' }}
        run: |
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/roadprints-debug.keystore"

      - name: Build debug APK
        run: |
          test -f "$RUNNER_TEMP/roadprints-debug.keystore"
          if [ -z "$ROADPRINTS_DEBUG_STORE_PASSWORD" ] || [ -z "$ROADPRINTS_DEBUG_KEY_ALIAS" ] || [ -z "$ROADPRINTS_DEBUG_KEY_PASSWORD" ]; then
            echo "::error::Configure ROADPRINTS_DEBUG_STORE_PASSWORD, ROADPRINTS_DEBUG_KEY_ALIAS and ROADPRINTS_DEBUG_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/roadprints-debug.keystore"
          gradle --no-daemon -p android-prototype testDebugUnitTest lintDebug assembleDebug

      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-verification-reports
          path: |
            android-prototype/app/build/reports/
            android-prototype/app/build/test-results/
            android-prototype/app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: warn
          retention-days: 14

      - name: Print lint errors
        if: failure()
        run: |
          report=android-prototype/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
