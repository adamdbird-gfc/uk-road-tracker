name: Package private Roadprints development APK

on:
  workflow_call:
    inputs:
      firebase_upload:
        type: boolean
        default: false
      distribute_existing_testers:
        type: boolean
        default: false
      source_ref:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadprints-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
      ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
      ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
      ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}

    steps:
      - name: Reject obsolete distribution flags
        if: inputs.firebase_upload || inputs.distribute_existing_testers
        run: |
          echo "::error::Packaging is development-only. Use the manually authorised artifact promotion workflow."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download and verify pinned external NCN test reference
        run: |
          python3 -m unittest discover -s scripts -p test_android_distribution_controls.py -v
          python3 scripts/prepare_ncn_reference.py
          NCN_TEST_DATABASE="$PWD/.cache/ncn/catalogue.db" python3 scripts/test_ncn_national.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Verify declarative venue registry
        run: |
          python3 scripts/generate_venue_collections.py --check
          python3 -m unittest discover -s scripts -p test_venue_catalogue.py

      - name: Verify service catalogue metadata rules
        run: python3 scripts/test_service_collection_metadata.py

      - name: Package pinned offline historic county reference
        run: bash android-prototype/scripts/prepare_county_reference.sh

      - name: Prepare stable debug signing key
        if: ${{ env.ROADPRINTS_DEBUG_KEYSTORE_B64 != '' }}
        run: |
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/roadprints-debug.keystore"

      - name: Build debug APK
        run: |
          test -f "$RUNNER_TEMP/roadprints-debug.keystore"
          if [ -z "$ROADPRINTS_DEBUG_STORE_PASSWORD" ] || [ -z "$ROADPRINTS_DEBUG_KEY_ALIAS" ] || [ -z "$ROADPRINTS_DEBUG_KEY_PASSWORD" ]; then
            echo "::error::Configure ROADPRINTS_DEBUG_STORE_PASSWORD, ROADPRINTS_DEBUG_KEY_ALIAS and ROADPRINTS_DEBUG_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/roadprints-debug.keystore"
          gradle --no-daemon -p android-prototype testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK signature and report test totals
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs android-prototype/app/build/outputs/apk/debug/app-debug.apk | tee "$RUNNER_TEMP/apk-certificate.txt"
          grep -Fq '5b7cdba0abd0cb41d570cdc348e3ca9bb8e2312cb7adf568bb536ce8577cc031' "$RUNNER_TEMP/apk-certificate.txt"
          sha256sum android-prototype/app/build/outputs/apk/debug/app-debug.apk | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Private development APK · source $GITHUB_SHA · no Firebase upload or tester notifications" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in glob.glob("android-prototype/app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print("Android test totals:", totals)
          assert totals["tests"] > 0 and totals["failures"] == totals["errors"] == 0
          PY

      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-verification-reports
          path: |
            android-prototype/app/build/reports/
            android-prototype/app/build/test-results/
            android-prototype/app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: warn
          retention-days: 3

      - name: Print lint errors
        if: failure()
        run: |
          report=android-prototype/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
