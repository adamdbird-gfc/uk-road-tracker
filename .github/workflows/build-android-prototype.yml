name: Build Android capture prototype

on:
  workflow_dispatch:
  push:
    paths:
      - "android-prototype/**"
      - ".github/workflows/build-android-prototype.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
      ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
      ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
      ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Verify service catalogue metadata rules
        run: python3 scripts/test_service_collection_metadata.py

      - name: Package pinned offline historic county reference
        run: bash android-prototype/scripts/prepare_county_reference.sh

      - name: Prepare stable debug signing key
        if: ${{ env.ROADPRINTS_DEBUG_KEYSTORE_B64 != '' }}
        run: |
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/roadprints-debug.keystore"

      - name: Build debug APK
        run: |
          test -f "$RUNNER_TEMP/roadprints-debug.keystore"
          if [ -z "$ROADPRINTS_DEBUG_STORE_PASSWORD" ] || [ -z "$ROADPRINTS_DEBUG_KEY_ALIAS" ] || [ -z "$ROADPRINTS_DEBUG_KEY_PASSWORD" ]; then
            echo "::error::Configure ROADPRINTS_DEBUG_STORE_PASSWORD, ROADPRINTS_DEBUG_KEY_ALIAS and ROADPRINTS_DEBUG_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/roadprints-debug.keystore"
          gradle --no-daemon -p android-prototype testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK signature and report test totals
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs android-prototype/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in glob.glob("android-prototype/app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print("Android test totals:", totals)
          assert totals["tests"] > 0 and totals["failures"] == totals["errors"] == 0
          PY

      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-verification-reports
          path: |
            android-prototype/app/build/reports/
            android-prototype/app/build/test-results/
            android-prototype/app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: warn
          retention-days: 14

      - name: Print lint errors
        if: failure()
        run: |
          report=android-prototype/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/feat/station-journey-boundaries'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@v6

      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: verified-apk

      - name: Publish versioned APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import re,pathlib; print(re.search(r"versionName = \"([^\"]+)\"", pathlib.Path("android-prototype/app/build.gradle.kts").read_text()).group(1))')
          tag="android-$version"
          cp verified-apk/app-debug.apk "$RUNNER_TEMP/roadprints-$version.apk"
          cat > "$RUNNER_TEMP/android-release-notes.md" <<'NOTES'
          Signed Roadprints Android prototype update.
          Roadprints map loading now includes a branded spinner and rotating offline road facts.
          Keeps the map, camera and decoded tiles alive while switching between main tabs; only changed saved data refreshes routes.
          Separates loading, empty travel record and retry states.
          Includes all automatic service station and 0.25.164 achievement improvements.
          The full Android test suite, lint and APK signature verification pass before publication.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" "$RUNNER_TEMP/roadprints-$version.apk" --target "$GITHUB_SHA" --title "Roadprints $version" --notes-file "$RUNNER_TEMP/android-release-notes.md" --prerelease --latest=false
          fi
