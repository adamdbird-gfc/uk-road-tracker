name: Package Roadprints test APK

on:
  workflow_dispatch:
    inputs:
      firebase_upload:
        description: Upload the verified signed APK to Firebase App Distribution
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package-current-app:
    uses: adamdbird-gfc/uk-road-tracker/.github/workflows/build-android-prototype.yml@fix/onboarding-start-tracking
    with:
      source_ref: fix/onboarding-start-tracking
      firebase_upload: ${{ inputs.firebase_upload }}
    secrets: inherit
