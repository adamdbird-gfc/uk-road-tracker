name: Package Roadprints test APK

on:
  workflow_call:
    inputs:
      firebase_upload:
        type: boolean
        default: false
      distribute_existing_testers:
        type: boolean
        default: false
      source_ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      firebase_upload:
        description: Upload the verified APK to Firebase App Distribution
        type: boolean
        default: false

      distribute_existing_testers:
        description: Share with the existing Firebase project testers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: roadprints-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
      ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
      ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
      ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Verify declarative venue registry
        run: |
          python3 scripts/generate_venue_collections.py --check
          python3 -m unittest discover -s scripts -p test_venue_catalogue.py

      - name: Verify service catalogue metadata rules
        run: python3 scripts/test_service_collection_metadata.py

      - name: Package pinned offline historic county reference
        run: bash android-prototype/scripts/prepare_county_reference.sh

      - name: Prepare stable debug signing key
        if: ${{ env.ROADPRINTS_DEBUG_KEYSTORE_B64 != '' }}
        run: |
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/roadprints-debug.keystore"

      - name: Build debug APK
        run: |
          test -f "$RUNNER_TEMP/roadprints-debug.keystore"
          if [ -z "$ROADPRINTS_DEBUG_STORE_PASSWORD" ] || [ -z "$ROADPRINTS_DEBUG_KEY_ALIAS" ] || [ -z "$ROADPRINTS_DEBUG_KEY_PASSWORD" ]; then
            echo "::error::Configure ROADPRINTS_DEBUG_STORE_PASSWORD, ROADPRINTS_DEBUG_KEY_ALIAS and ROADPRINTS_DEBUG_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/roadprints-debug.keystore"
          gradle --no-daemon -p android-prototype testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK signature and report test totals
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs android-prototype/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in glob.glob("android-prototype/app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print("Android test totals:", totals)
          assert totals["tests"] > 0 and totals["failures"] == totals["errors"] == 0
          PY

      - name: Publish verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-verification-reports
          path: |
            android-prototype/app/build/reports/
            android-prototype/app/build/test-results/
            android-prototype/app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: warn
          retention-days: 3

      - name: Print lint errors
        if: failure()
        run: |
          report=android-prototype/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  firebase:
    needs: build
    if: inputs.firebase_upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out verified source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: roadprints-capture-prototype-debug
          path: verified-apk

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.33.0

      - name: Install existing-tester API authentication
        if: inputs.distribute_existing_testers
        run: python3 -m pip install google-auth==2.40.3 requests==2.32.5

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ROADPRINTS_DISTRIBUTE_EXISTING_TESTERS: ${{ inputs.distribute_existing_testers }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/roadprints-firebase-credentials.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          python3 - <<'PY'
          import json, os, pathlib
          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON', '')
          if not raw:
              raise SystemExit('Configure the FIREBASE_SERVICE_ACCOUNT_JSON repository Actions secret first. See docs/android-firebase-distribution.md.')
          try:
              credentials = json.loads(raw)
          except ValueError:
              raise SystemExit('FIREBASE_SERVICE_ACCOUNT_JSON must contain valid service-account JSON.')
          if credentials.get('type') != 'service_account' or credentials.get('project_id') != 'roadprints-822cc' or not credentials.get('private_key') or not credentials.get('client_email'):
              raise SystemExit('Expected a service-account key for roadprints-822cc, not google-services.json.')
          path = pathlib.Path(os.environ['GOOGLE_APPLICATION_CREDENTIALS'])
          path.touch(mode=0o600, exist_ok=False)
          path.write_text(raw)
          PY
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          bash scripts/upload_android_firebase.sh verified-apk/app-debug.apk

      - name: Remove deployment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/roadprints-firebase-credentials.json"
