name: NCN corridor policy evidence (offline, no release)
on:
  pull_request:
    paths:
      - 'docs/ncn-corridor-policy/**'
      - '.github/workflows/ncn-corridor-policy-validation.yml'
permissions:
  contents: read
jobs:
  bounded-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-ncn-deal.txt
      - name: Bounded geometry, finite admission and shared accounting controls
        run: python -m unittest discover -s docs/ncn-corridor-policy -p 'test_policy_evidence.py' -v
      - name: Retained positive and negative controls
        run: |
          python -m unittest scripts.test_ncn_deal_correspondence scripts.test_ncn_source_compatibility scripts.ncn_trial.test_open_completion scripts.test_ncn_binding_attainability scripts.ncn_trial.test_ordinary_seams scripts.ncn_trial.test_coverage scripts.ncn_trial.test_inventory_completion scripts.ncn_trial.test_extent_composition -v
