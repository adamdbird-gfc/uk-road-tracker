name: Publish verified Roadprints Stage 4.7 owner APK
on:
  push:
    branches: [feat/railway-stage4-7]
    paths: [.github/workflows/stage4-7-owner.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: roadprints-stage4-7-package
  cancel-in-progress: false
jobs:
  signed-apk:
    if: github.repository == 'adamdbird-gfc/uk-road-tracker' && github.ref == 'refs/heads/feat/railway-stage4-7'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: adamdbird-gfc/uk-road-tracker
      BASELINE: 3a0d6870116163d377993b8306b80d3188066415
      VALIDATION_RUN: '43512255293'
      SOURCE_SHA: ${{ github.sha }}
      CATALOGUE_SHA256: 5409cf795b0ab58e4ef9911531b463c538c0a5e8c8555e3183ecb7d23c3dad5a
      CATALOGUE_BYTES: '15183872'
      CERT_SHA256: 5b7cdba0abd0cb41d570cdc348e3ca9bb8e2312cb7adf568bb536ce8577cc031
      APK: Roadprints-0.25.238-284.apk
      TAG: roadprints-0.25.238-284-stage4.7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify the reviewed source and the successful Android validation
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASELINE" "$SOURCE_SHA"
          git diff --exit-code "$BASELINE" "$SOURCE_SHA" -- android-prototype scripts/check_railway_migration_android.sh .github/workflows/stage4-7-railway-validation.yml
          gh api "repos/$GH_REPO/actions/runs/$VALIDATION_RUN" | jq -e --arg sha "$BASELINE" '
            .head_sha == $sha and .conclusion == "success"
            and .path == ".github/workflows/stage4-7-railway-validation.yml"' >/dev/null
      - name: Restore existing packaging reference cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/ncn/catalogue.db
            android-prototype/app/src/main/assets/historic-counties/boundaries.bin
          key: reference-pins-v2-${{ runner.os }}-${{ hashFiles('android-prototype/app/src/main/assets/ncn-national/manifest.json', 'android-prototype/app/src/main/assets/historic-counties/catalogue.json') }}
          fail-on-cache-miss: true
      - name: Verify the county reference and select Java 17
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          folder = pathlib.Path('android-prototype/app/src/main/assets/historic-counties')
          expected = json.loads((folder / 'catalogue.json').read_text())['data_sha256']
          with (folder / 'boundaries.bin').open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == expected
          PY
          test -n "$JAVA_HOME_17_X64"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
          cache-read-only: true
      - name: Restore the exact national railway asset used for validation
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/railway.zip"
          gh api "repos/$GH_REPO/actions/artifacts/14059854393/zip" > "$bundle"
          echo "583dc9abb1d90ce341d214cd1bd280bbe8d62ab1fa4b9d1854097e47023fe4fa  $bundle" | sha256sum --check
          assets=android-prototype/app/src/main/assets/railway
          unzip -p "$bundle" src/main/assets/railway/national.json > "$assets/national.json"
          unzip -p "$bundle" src/main/assets/railway/national.sqlite.gzip > "$assets/national.sqlite.gzip"
      - name: Assemble one APK with the established owner signing identity
        env:
          ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
          ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
          ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
          ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROADPRINTS_DEBUG_KEYSTORE_B64"
          test -n "$ROADPRINTS_DEBUG_STORE_PASSWORD"
          test -n "$ROADPRINTS_DEBUG_KEY_ALIAS"
          test -n "$ROADPRINTS_DEBUG_KEY_PASSWORD"
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/roadprints-debug.keystore"
          trap 'rm -f "$ROADPRINTS_DEBUG_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$ROADPRINTS_DEBUG_KEYSTORE"
          unset ROADPRINTS_DEBUG_KEYSTORE_B64
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:assembleDebug
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$APK"
      - name: Verify package, signer, and packaged catalogue
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/$APK"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/certificate.txt"
          grep -E "certificate SHA-256 digest: $CERT_SHA256$" "$RUNNER_TEMP/certificate.txt"
          "${signer%/*}/aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          grep -F "package: name='com.roadprints.capture' versionCode='284' versionName='0.25.238'" "$RUNNER_TEMP/package.txt"
          grep -F "launchable-activity: name='com.roadprints.capture.OnboardingActivity'" "$RUNNER_TEMP/package.txt"
          python3 scripts/verify_milepost_apk.py "$apk"
          python3 - "$apk" <<'PY'
          import gzip, hashlib, os, pathlib, sys, zipfile
          apk = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(apk) as package:
              catalogue = gzip.decompress(package.read('assets/railway/regional.sqlite.gzip'))
              assert len(catalogue) == int(os.environ['CATALOGUE_BYTES'])
              assert hashlib.sha256(catalogue).hexdigest() == os.environ['CATALOGUE_SHA256']
              with gzip.GzipFile(fileobj=package.open('assets/railway/national.sqlite.gzip')) as national:
                  assert hashlib.file_digest(national, 'sha256').hexdigest() == 'cea7233a920bdc90130da19a4c2d5ac82e7e7001d4213c996d171c95abd4f48f'
              paths = package.read('assets/railway/network-first-r1.bin.gzip')
              assert hashlib.sha256(paths).hexdigest() == '80f4486253e94658b7128411b9c52b29e07e7dddd04c4f8392ae8af6afc5d340'
              dex = b''.join(package.read(name) for name in package.namelist() if name.endswith('.dex'))
              for symbol in (b'JourneyOriginRecovery;', b'RailwayTrialWorker;', b'RegionalRailwayCatalogue;', b'NetworkFirstRailway;', b'RailwayMileage;', b'NationalRailway;', b'NationalRailwayCatalogue;'):
                  assert symbol in dex, symbol
          PY
          echo "APK_SHA256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK_BYTES=$(stat -c %s "$apk")" >> "$GITHUB_ENV"
      - name: Publish and verify the direct GitHub Release asset
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/$APK"
          if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release create "$TAG" "$apk" --target "$SOURCE_SHA" --prerelease --latest=false \
              --title 'Roadprints 0.25.238 (284) • Stage 4.7 owner test' \
              --notes "Controlled Pixel 10 owner test. Install over signed Build 283. Saved train journeys are checked automatically. Journeys without enough evidence keep their saved distances. Source: $SOURCE_SHA. APK SHA-256: $APK_SHA256."
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$SOURCE_SHA"
          asset_url=$(gh api "repos/$GH_REPO/releases/tags/$TAG" | jq -er --arg apk "$APK" --argjson size "$APK_BYTES" \
            'select(.draft == false and .prerelease == true) | .assets[] | select(.name == $apk and .size == $size and .state == "uploaded") | .browser_download_url')
          test "$asset_url" = "https://github.com/$GH_REPO/releases/download/$TAG/$APK"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --max-time 120 --output "$RUNNER_TEMP/downloaded.apk" "$asset_url"
          cmp "$apk" "$RUNNER_TEMP/downloaded.apk"
          printf '%s\n' "Source: $SOURCE_SHA" "Build: 0.25.238 (284)" "Bytes: $APK_BYTES" \
            "APK SHA-256: $APK_SHA256" "Signing certificate SHA-256: $CERT_SHA256" "$asset_url" | tee -a "$GITHUB_STEP_SUMMARY"
