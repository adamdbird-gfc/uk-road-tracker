name: Build settlement inventories

on:
  workflow_dispatch:
    inputs:
      settlements:
        description: "Comma-separated official ONS settlement names"
        required: false
        default: "Gravesend, Gillingham (Medway), Haverhill"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install boundary tools
        run: python -m pip install shapely
      - name: Build requested settlements
        env:
          SETTLEMENTS: ${{ inputs.settlements }}
        run: |
          IFS=',' read -ra towns <<< "$SETTLEMENTS"
          for town in "${towns[@]}"; do
            town="$(echo "$town" | xargs)"
            python scripts/build_settlement_inventory.py "$town"
          done
      - name: Upload settlement inventory cache
        uses: actions/upload-artifact@v4
        with:
          name: settlement-inventories-v1
          path: settlement-inventories-v1/
