name: Build settlement inventory batch
on:
  workflow_dispatch:
    inputs:
      settlements:
        description: "Comma-separated official ONS settlement names"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install shapely
      - name: Build requested settlements
        env:
          SETTLEMENTS: ${{ inputs.settlements }}
        run: |
          IFS=',' read -ra towns <<< "$SETTLEMENTS"
          for town in "${towns[@]}"; do
            town="$(echo "$town" | xargs)"
            python scripts/build_settlement_inventory.py "$town"
          done
      - uses: actions/upload-artifact@v4
        with: {name: settlement-inventory-batch, path: settlement-inventories-v1}
