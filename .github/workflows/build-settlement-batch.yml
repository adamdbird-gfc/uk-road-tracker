name: Build settlement inventory batch
on:
  workflow_dispatch:
    inputs:
      settlements:
        description: "Comma-separated official ONS settlement names"
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install shapely
      - run: python scripts/build_settlement_inventory.py ${{ inputs.settlements }}
      - uses: actions/upload-artifact@v4
        with: {name: settlement-inventory-batch, path: settlement-inventories-v1}
