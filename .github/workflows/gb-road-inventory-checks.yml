name: GB road inventory generator checks

on:
  pull_request:
    paths:
      - scripts/*generate_gb_road_inventory_candidates.py
      - .github/workflows/gb-road-inventory-checks.yml
  push:
    branches: [main]
    paths:
      - scripts/*generate_gb_road_inventory_candidates.py
      - .github/workflows/gb-road-inventory-checks.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-bulk-settlement-trial.txt
      - run: python -m unittest discover -s scripts -p test_generate_gb_road_inventory_candidates.py
