name: Roadprints Level 1 private APK

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - android-prototype/app/build.gradle.kts
      - .github/workflows/level1-owner-apk.yml

permissions:
  contents: read

jobs:
  package:
    if: github.event.pull_request.number == 305 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Restore existing packaging reference cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .cache/ncn/catalogue.db
            android-prototype/app/src/main/assets/historic-counties/boundaries.bin
          key: reference-pins-v2-${{ runner.os }}-${{ hashFiles('android-prototype/app/src/main/assets/ncn-national/manifest.json', 'android-prototype/app/src/main/assets/historic-counties/catalogue.json') }}
          fail-on-cache-miss: true
      - name: Verify the packaged county reference
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          folder = pathlib.Path('android-prototype/app/src/main/assets/historic-counties')
          expected = json.loads((folder / 'catalogue.json').read_text())['data_sha256']
          with (folder / 'boundaries.bin').open('rb') as source:
              assert hashlib.file_digest(source, 'sha256').hexdigest() == expected
          PY
      - name: Select the existing Java and SDK installations
        run: |
          test -n "$JAVA_HOME_17_X64"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
          cache-read-only: true
      - name: Run focused checks and render production previews
        run: |
          set -euo pipefail
          sdk_jars="$RUNNER_TEMP/robolectric-jars"
          mkdir -p "$sdk_jars"
          for sdk in 9-robolectric-4913185-2-i7 15-robolectric-12650502-i7; do
            jar="android-all-instrumented-$sdk.jar"
            curl -fsSL --max-time 90 "https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented/$sdk/$jar" -o "$sdk_jars/$jar"
          done
          android-prototype/scripts/ui-previews.sh "$GITHUB_WORKSPACE/private-apk/previews" \
            --no-daemon -Pandroid.builder.sdkDownload=false \
            -Drobolectric.offline=true "-Drobolectric.dependency.dir=$sdk_jars" \
            --tests '*MilepostCorrectiveVisibilityTest' --tests '*MilepostPresentationTest' \
            --tests '*MilepostIntegrationTest' --tests '*MilepostAnimationTest' \
            --tests '*MapLegendTest' --tests '*MapLocationRequestTest'
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          suites = [ElementTree.parse(p).getroot() for p in Path('android-prototype/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          assert suites
          summary = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests','failures','errors','skipped')}
          assert not (summary['failures'] or summary['errors'] or summary['skipped'])
          Path('private-apk/tests.txt').write_text(str(summary)+'\n')
          print(summary)
          PY
      - name: Build and verify the in-place update
        env:
          ROADPRINTS_DEBUG_KEYSTORE_B64: ${{ secrets.ROADPRINTS_DEBUG_KEYSTORE_B64 }}
          ROADPRINTS_DEBUG_STORE_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_STORE_PASSWORD }}
          ROADPRINTS_DEBUG_KEY_ALIAS: ${{ secrets.ROADPRINTS_DEBUG_KEY_ALIAS }}
          ROADPRINTS_DEBUG_KEY_PASSWORD: ${{ secrets.ROADPRINTS_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ROADPRINTS_DEBUG_KEYSTORE_B64"
          test -n "$ROADPRINTS_DEBUG_STORE_PASSWORD"
          test -n "$ROADPRINTS_DEBUG_KEY_ALIAS"
          test -n "$ROADPRINTS_DEBUG_KEY_PASSWORD"
          export ROADPRINTS_DEBUG_KEYSTORE="$RUNNER_TEMP/roadprints-debug.keystore"
          trap 'rm -f "$ROADPRINTS_DEBUG_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ROADPRINTS_DEBUG_KEYSTORE_B64" | base64 --decode > "$ROADPRINTS_DEBUG_KEYSTORE"
          unset ROADPRINTS_DEBUG_KEYSTORE_B64
          gradle --no-daemon --stacktrace -p android-prototype -Pandroid.builder.sdkDownload=false :app:assembleDebug
          mkdir -p private-apk
          apk=private-apk/Roadprints-0.25.231-277.apk
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk "$apk"
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "${tools%/*}/apksigner" verify --print-certs "$apk" | tee private-apk/certificate.txt
          grep -Fq 'certificate SHA-256 digest: 5b7cdba0abd0cb41d570cdc348e3ca9bb8e2312cb7adf568bb536ce8577cc031' private-apk/certificate.txt
          "${tools%/*}/aapt" dump badging "$apk" > private-apk/package.txt
          grep -Fq "package: name='com.roadprints.capture' versionCode='277' versionName='0.25.231'" private-apk/package.txt
          grep -Fq "launchable-activity: name='com.roadprints.capture.OnboardingActivity'" private-apk/package.txt
          python3 scripts/verify_milepost_apk.py "$apk"
          python3 - "$apk" <<'PY'
          import hashlib, pathlib, sys, zipfile
          apk = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(apk) as package:
              dex = b''.join(package.read(n) for n in package.namelist() if n.endswith('.dex'))
              for symbol in (b'MilepostDetailsDialog;', b'locationLabel', b'MilepostPresentationView$ChapterIndicators;', b'MapLocationRequest;'):
                  assert symbol in dex, symbol
          with apk.open('rb') as source:
              print(f'{apk.name} | {apk.stat().st_size} bytes | SHA-256 {hashlib.file_digest(source, "sha256").hexdigest()}')
          PY
      - name: Retain focused test diagnostics if checks fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roadprints-level1-focused-results
          path: android-prototype/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roadprints-level1-0.25.231-277
          path: private-apk/
          if-no-files-found: error
          retention-days: 14
