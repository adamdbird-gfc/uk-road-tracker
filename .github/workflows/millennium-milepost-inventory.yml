name: Millennium milepost inventory
on:
  pull_request:
    paths:
      - 'reference-data/millennium-mileposts/**'
      - 'scripts/milepost_catalogue.py'
      - 'scripts/test_milepost_catalogue.py'
      - '.github/workflows/millennium-milepost-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source, reproduce catalogue and test safe cache transitions
        run: |
          python -m unittest scripts.test_milepost_catalogue -v
          python scripts/milepost_catalogue.py --output /tmp/milepost-reproduced
          cmp reference-data/millennium-mileposts/revision-1/catalogue.jsonl /tmp/milepost-reproduced/catalogue.jsonl
          cmp reference-data/millennium-mileposts/revision-1/manifest.json /tmp/milepost-reproduced/manifest.json
