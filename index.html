<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Roadprints — web prototype retired</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1c50; color: #fff; }
    main { max-width: 38rem; margin: 1.5rem; padding: clamp(1.5rem, 5vw, 3rem); border: 1px solid #46649e; border-radius: 1rem; background: #10275d; }
    p { font-size: 1.125rem; line-height: 1.6; color: #d3dced; }
    .brand { color: #67d5cc; font-weight: 700; letter-spacing: .08em; }
    h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.2; }
  </style>
</head>
<body>
  <main>
    <p class="brand">ROADPRINTS</p>
    <h1>The web prototype has retired</h1>
    <p>Roadprints has moved on to the Android app. Invited beta testers can get the latest version through Firebase.</p>
    <p>The old web tracking and import tools are no longer available here.</p>
  </main>
</body>
</html>
